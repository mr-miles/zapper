<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>zapper</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#d7dae0; --dim:#8b93a3; --ok:#4cc38a; --bad:#ef6b73; --warn:#e5b454; --accent:#6ea8fe; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --panel:#fff; --line:#e3e6eb; --text:#1d2129; --dim:#6b7280; } }
  * { box-sizing: border-box; }
  body { margin:0; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:16px; align-items:center; padding:10px 40px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:1; }
  header h1 { font-size:15px; margin:0; letter-spacing:.5px; }
  /* footer: the way back to the office, where the office has its link here */
  footer.foot { position:fixed; left:0; right:0; bottom:0; z-index:1; height:32px; display:flex; align-items:center; padding:0 40px; background:var(--panel); border-top:1px solid var(--line); font-size:12.5px; }
  footer.foot a { margin-left:auto; color:var(--dim); text-decoration:none; }
  footer.foot a:hover { color:var(--text); }
  /* zapper built without the office: nothing to go back to */
  html.office-disabled footer.foot { display:none; }
  header .ro { color:var(--dim); font-size:11px; border:1px solid var(--line); padding:1px 6px; border-radius:9px; }
  nav button { background:none; border:0; color:var(--dim); font:inherit; padding:6px 10px; cursor:pointer; border-radius:6px; }
  nav button.on { color:var(--text); background:var(--line); }
  .stat { margin-left:auto; display:flex; gap:14px; color:var(--dim); }
  .stat b { color:var(--text); }
  main { padding:20px 40px 56px; }
  section { display:none; } section.on { display:block; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--line); }
  .mono, pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; max-height:70vh; margin:0; }
  .pill { display:inline-block; padding:0 7px; border-radius:9px; font-size:11px; border:1px solid currentColor; }
  .allow, .running { color:var(--ok); } .deny, .failed { color:var(--bad); } .ask, .starting { color:var(--warn); } .stopped { color:var(--dim); }
  .dim { color:var(--dim); }
  .bar { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
  button.act { font:inherit; border:1px solid var(--line); border-radius:6px; padding:3px 10px; cursor:pointer; background:var(--panel); color:var(--text); }
  button.act.allow { border-color:var(--ok); color:var(--ok); } button.act.deny { border-color:var(--bad); color:var(--bad); }
  button.act:disabled { opacity:.5; cursor:default; }
  td select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:2px 6px; font:inherit; }
  .bar select, .bar input { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font:inherit; }
  h2 { font-size:13px; color:var(--dim); font-weight:500; margin:18px 0 8px; text-transform:uppercase; letter-spacing:.6px; }
  .link { color:var(--accent); cursor:pointer; text-decoration:underline; text-decoration-style:dotted; }
  table.net tr.click.sel td { background:var(--line); }
  table.net td { white-space:nowrap; } table.net td.url { white-space:normal; word-break:break-all; }
  #session-req .tabs button { background:none; border:0; border-bottom:2px solid transparent; color:var(--dim); font:inherit; padding:6px 10px; cursor:pointer; }
  #session-req .tabs button.on { color:var(--text); border-bottom-color:var(--accent); }
  #session-req .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-top:6px; }
  #session-req dl { display:grid; grid-template-columns: max-content 1fr; gap:2px 14px; margin:4px 0 12px; }
  #session-req dt { color:var(--dim); } #session-req dd { margin:0; word-break:break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
  .cols { display:grid; grid-template-columns: 1fr 1fr; gap:24px; }
  /* A session: its details, its terminals, and the chosen one live. */
  /* The details on the left; the preview on the right, its terminal picked below it. */
  .stop { display:grid; grid-template-columns: minmax(240px, 1fr) 448px; column-gap:48px; row-gap:24px; align-items:start; margin-top:12px; }
  #session-term-ff { position:relative; }
  #session-term-h { margin-top:10px; }
  #session-term-h select { width:100%; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (max-width: 1000px) { .stop { grid-template-columns: 1fr; } #session-term-f { max-width:448px; } }
  /* Over the preview's top right corner. */
  #session-term-f .pv { position:relative; }
  #session-term-fh { position:absolute; top:8px; right:8px; z-index:2; }
  #session-term-fh .pop { background:rgba(23,26,33,.85); }
  /* The terminal's preview: its frame at full size, scaled to half. */
  #session-term-ff .preview { position:relative; width:100%; height:100%; overflow:hidden; border:1px solid var(--line); border-radius:8px; background:#000; cursor:zoom-in; }
  #session-term-ff .preview iframe { position:absolute; left:0; top:0; border:0; transform-origin:0 0; pointer-events:none; }
  #session-term-ff .preview .veil { position:absolute; inset:0; }
  /* Full size: over the page, until clicked again. */
  #session-term-ff .preview.full { position:fixed; inset:6vh 6vw; z-index:30; width:auto; aspect-ratio:auto !important; box-shadow:0 20px 60px rgba(0,0,0,.6); cursor:zoom-out; }
  #session-term-ff .preview.full iframe { transform-origin:0 0; }
  /* Long commands: two lines, the rest on a click. */
  .clamp { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; word-break:break-all; }
  .clamp.open { display:block; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  ul.kv { list-style: disc; margin:0; padding-left:20px; line-height:1.9; }
  ul.kv .k { color:var(--dim); }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:8px; margin-bottom:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .card .k { color:var(--dim); font-size:11px; } .card .v { font-size:15px; }
  .diff-add { color:var(--ok); } .diff-del { color:var(--bad); } .diff-hunk { color:var(--accent); }
  .empty { color:var(--dim); padding:14px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>⚡ zapper</h1>
  <nav id="nav"></nav>
  <div class="stat" id="stat"></div>
</header>
<main>
  <section id="sessions"></section>
  <section id="session">
    <div id="session-bar"></div>
    <div class="stop"><div id="session-info"></div><div id="session-term-f"><h2>preview</h2><div class="pv"><div id="session-term-fh"></div><div id="session-term-ff"></div></div><div id="session-term-h"></div></div></div>
    <div id="session-net">
      <h2>network</h2>
      <div class="bar"><input id="net-q" placeholder="filter: method, host, path, status"><span class="dim" id="net-count"></span></div>
      <table class="net"><thead><tr><th>#</th><th>method</th><th>url</th><th>status</th><th>type</th><th>size</th><th>time</th><th>rule</th></tr></thead><tbody id="net-body"></tbody></table>
    </div>
    <div id="session-req"></div>
    <div id="session-more"></div>
  </section>
  <section id="events">
    <div class="bar">
      <select id="ev-session"><option value="">all sessions</option></select>
      <select id="ev-type"><option value="">all types</option><option>net</option><option>dns</option><option>exec</option><option>ask</option><option>answer</option><option>guest</option><option>shell</option><option>session</option><option>config</option></select>
      <select id="ev-action"><option value="">any action</option><option>allow</option><option>deny</option></select>
      <input id="ev-q" placeholder="filter text">
      <span class="dim" id="ev-count"></span>
    </div>
    <table><thead><tr><th>time</th><th>session</th><th>type</th><th>action</th><th>detail</th><th>rule</th></tr></thead><tbody id="ev-body"></tbody></table>
  </section>
  <section id="approvals"></section>
  <section id="rules"></section>
  <section id="config">
    <div class="bar"><select id="cfg-view"><option value="running">running config</option><option value="startup">startup config</option><option value="diff">diff startup → running</option></select><span class="dim" id="cfg-hint"></span></div>
    <pre id="cfg"></pre>
  </section>
</main>
<footer class="foot"><a id="back" href="/">← back to the office</a></footer>
<script>
// Everything shown comes from sessions that may be hostile: build the DOM
// with textContent only, never innerHTML.
const $ = (id) => document.getElementById(id);
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v; else if (k === 'on') e.addEventListener('click', v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) e.append(k instanceof Node ? k : document.createTextNode(k == null ? '' : String(k)));
  return e;
}
// JSON responses are parsed; everything else, the ndjson audit log included,
// comes back as text.
// Back to the firm the office came from (`/sessions?firm=acme`).
{
  const f = new URLSearchParams(location.search).get('firm');
  if (f && /^[a-z0-9][a-z0-9-]{0,62}$/.test(f)) { $('back').textContent = '← back to ' + f; $('back').href = '/#firm=' + f; }
}
const api = (p) => fetch('/api' + p).then(r => { if (!r.ok) throw new Error(r.status); return (r.headers.get('content-type') || '').startsWith('application/json') ? r.json() : r.text(); });
const time = (t) => new Date(t * 1000).toLocaleTimeString();
const ago = (t) => { const s = Math.round(Date.now() / 1000 - t); return s < 90 ? s + 's' : s < 5400 ? Math.round(s / 60) + 'm' : Math.round(s / 3600) + 'h'; };
const pill = (cls, text) => el('span', { class: 'pill ' + cls }, text ?? cls);
const sessionLink = (id) => id ? el('span', { class: 'link', title: 'open session ' + id, on: () => show('session', id) }, id) : '';

const tabs = ['sessions', 'events', 'approvals', 'rules', 'config'];
let tab = 'sessions', current = null;
function show(t, arg) {
  if (t !== 'session' || arg !== current) { selectedReq = null; $('session-req').replaceChildren(); $('net-q').value = ''; }
  tab = t; current = arg ?? null;
  for (const s of document.querySelectorAll('section')) s.classList.toggle('on', s.id === t);
  for (const b of $('nav').children) b.classList.toggle('on', b.dataset.t === t || (t === 'session' && b.dataset.t === 'sessions'));
  refresh();
}
for (const t of tabs) { const b = el('button', { on: () => show(t) }, t); b.dataset.t = t; $('nav').append(b); }
function markPending(n) {
  const b = [...$('nav').children].find(b => b.dataset.t === 'approvals');
  b.textContent = n ? 'approvals (' + n + ')' : 'approvals';
  b.classList.toggle('ask', n > 0);
}

async function refresh() {
  try {
    const st = await api('/status');
    markPending(st.pending_approvals);
    $('stat').replaceChildren(
      el('span', {}, el('b', {}, st.running), ' running'),
      el('span', {}, el('b', {}, st.pending_approvals), ' pending'),
      st.unsaved_changes ? el('span', { class: 'ask' }, 'unsaved config') : el('span', {}, 'config saved'));
    if (tab === 'sessions') await renderSessions();
    if (tab === 'session') await renderSession(current);
    if (tab === 'events') renderEvents();
    if (tab === 'approvals') await renderApprovals();
    if (tab === 'rules') await renderRules();
    if (tab === 'config') await renderConfig();
  } catch (e) {
    // Tell a page error apart from the daemon being down.
    const up = await fetch('/api/status').then(r => r.ok, () => false);
    $('stat').replaceChildren(el('span', { class: 'deny' }, up ? 'page error: ' + e.message : 'daemon unreachable'));
  }
}

async function renderSessions() {
  const list = await api('/sessions');
  const sel = $('ev-session'), keep = sel.value;
  sel.replaceChildren(el('option', { value: '' }, 'all sessions'), ...list.map(s => el('option', { value: s.id }, s.id + ' · ' + s.profile)));
  sel.value = keep;
  if (!list.length) return $('sessions').replaceChildren(el('div', { class: 'empty' }, 'No sessions. Start one with `zapper run`.'));
  const rows = list.sort((a, b) => b.created - a.created).map(s => {
    const c = s.counters;
    const left = s.expires ? Math.max(0, Math.round((s.expires - Date.now() / 1000) / 60)) + ' min left' : '';
    const tr = el('tr', { class: 'click', on: () => show('session', s.id) },
      el('td', { class: 'mono' }, s.id), el('td', {}, s.profile), el('td', {}, pill(s.state), ' ', el('span', { class: 'dim' }, s.detail || '')),
      el('td', {}, ago(s.created) + ' ago', el('div', { class: 'dim' }, left)),
      el('td', { class: 'mono' }, s.image, el('div', { class: 'dim' }, s.vcpus + ' vCPU · ' + s.memory_mib + ' MiB')),
      el('td', {}, el('span', { class: 'allow' }, c.net_allowed), ' / ', el('span', { class: 'deny' }, c.net_denied)),
      el('td', {}, el('span', { class: 'allow' }, c.exec_allowed), ' / ', el('span', { class: 'deny' }, c.exec_denied)),
      el('td', {}, c.exits), el('td', {}, s.root ? pill('ask', 'root') : s.user));
    return tr;
  });
  $('sessions').replaceChildren(el('table', {}, el('thead', {}, el('tr', {}, ['id', 'profile', 'state', 'age', 'vm', 'net ✓/✗', 'exec ✓/✗', 'exits', 'user'].map(h => el('th', {}, h)))), el('tbody', {}, rows)));
}

async function renderSession(id) {
  let s, audit;
  try {
    [s, audit] = await Promise.all([api('/sessions/' + id), api('/sessions/' + id + '/audit')]);
  } catch (e) {
    if (e.message !== '404') throw e;
    $('session-bar').replaceChildren(el('div', { class: 'bar' }, el('button', { on: () => show('sessions') }, '← sessions')));
    $('session-info').replaceChildren(el('div', { class: 'empty' }, 'Session ' + id + ' has ended. Its audit log stays in the daemon\'s state directory.'));
    showTerminal(id, []);
    for (const part of ['session-req', 'session-more']) $(part).replaceChildren();
    $('net-body').replaceChildren();
    return;
  }
  const events = audit.split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
  const item = (k, ...v) => el('li', {}, el('span', { class: 'k' }, k + ': '), ...v);
  const c = s.counters;
  const execs = events.filter(e => e.type === 'exec').slice(-200).reverse();
  const exits = events.filter(e => e.type === 'guest' && e.event.event === 'exit').slice(-200).reverse();
  const terms = await api('/sessions/' + id + '/terminals');
  $('session-bar').replaceChildren(
    el('div', { class: 'bar' }, el('button', { on: () => show('sessions') }, '← sessions'), el('b', { class: 'mono' }, s.id), pill(s.state), el('span', { class: 'dim' }, s.detail || '')));
  $('session-info').replaceChildren(el('div', {}, el('h2', {}, 'details'), el('ul', { class: 'kv' },
    item('profile', s.profile),
    item('vm', s.image, el('span', { class: 'dim' }, ' · ' + s.vcpus + ' vCPU · ' + s.memory_mib + ' MiB')),
    item('user', s.root ? pill('ask', 'root') : s.user),
    item('workdir', el('span', { class: 'mono' }, s.workdir)),
    item('up', ago(s.created), el('span', { class: 'dim' }, ' · since ' + new Date(s.created * 1000).toLocaleTimeString())),
    item('expires', s.expires ? new Date(s.expires * 1000).toLocaleString() : 'never'),
    item('network', el('span', { class: 'allow' }, c.net_allowed + ' allowed'), ' · ', el('span', { class: 'deny' }, c.net_denied + ' denied')),
    item('programs', el('span', { class: 'allow' }, c.exec_allowed + ' allowed'), ' · ', el('span', { class: 'deny' }, c.exec_denied + ' denied')),
    item('process exits', c.exits),
    item('session rules', s.rules))));
  showTerminal(id, terms);
  renderNetwork(id);
  $('session-more').replaceChildren(
    el('h2', {}, 'exec (latest first)'),
    execs.length ? el('table', {}, el('thead', {}, el('tr', {}, ['time', 'action', 'pid', 'command', 'cwd', 'rule', 'wait'].map(h => el('th', {}, h)))),
      el('tbody', {}, execs.map(e => el('tr', {}, el('td', {}, time(e.ts)), el('td', {}, pill(e.action)), el('td', { class: 'mono' }, e.pid),
        el('td', { class: 'mono' }, el('div', { class: 'clamp', title: 'click to show it all', on: (ev) => ev.currentTarget.classList.toggle('open') }, e.argv.join(' '))), el('td', { class: 'mono dim' }, e.cwd || ''), el('td', { class: 'mono' }, e.rule || 'default'), el('td', {}, e.wait_ms.toFixed(1) + ' ms'))))) : el('div', { class: 'empty' }, 'no execs'),
    el('h2', {}, 'process exits (latest first)'),
    exits.length ? el('table', {}, el('thead', {}, el('tr', {}, ['time', 'pid', 'command', 'exit', 'elapsed', 'cpu user/sys', 'avg mem', 'io'].map(h => el('th', {}, h)))),
      el('tbody', {}, exits.map(({ ts, event: x }) => el('tr', {}, el('td', {}, time(ts)), el('td', { class: 'mono' }, x.pid), el('td', { class: 'mono' }, x.comm),
        el('td', {}, x.signal ? pill('deny', 'sig ' + x.signal) : x.exit_code ? pill('deny', x.exit_code) : pill('allow', '0')),
        el('td', {}, x.elapsed_ms + ' ms'), el('td', {}, x.user_ms + ' / ' + x.sys_ms + ' ms'), el('td', {}, x.mem_kib + ' KiB'), el('td', {}, x.io_bytes + ' B'))))) : el('div', { class: 'empty' }, 'no exits yet'));
}

// How each pending approval should be remembered, kept across refreshes.
const rememberChoice = {};
let answerError = '';

async function answer(id, allow) {
  const remember = rememberChoice[id] || null;
  const r = await fetch('/api/approvals/' + encodeURIComponent(id), {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-zapper-ui': '1' },
    body: JSON.stringify({ allow, remember }),
  });
  answerError = r.ok ? '' : 'Could not answer ' + id + ': ' + (await r.text());
  delete rememberChoice[id];
  await refresh();
}

let shownApprovals = '';
// Network: requests and connections, like a browser's developer tools.
let selectedReq = null;
const size = (n) => n == null ? '' : n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' kB' : (n / 1048576).toFixed(1) + ' MB';
const ms = (v) => v == null ? '' : v < 1000 ? Math.round(v) + ' ms' : (v / 1000).toFixed(2) + ' s';
async function renderNetwork(sessionId) {
  const list = await api('/sessions/' + sessionId + '/requests');
  const q = $('net-q').value.toLowerCase();
  const shown = list.filter(r => !q || (r.method + ' ' + r.url + ' ' + (r.status ?? '') + ' ' + (r.rule ?? '')).toLowerCase().includes(q)).reverse();
  $('net-count').textContent = shown.length + ' of ' + list.length;
  $('net-body').replaceChildren(...shown.map(r => {
    const status = r.method === 'CONNECT' && !r.error && r.action !== 'deny' ? pill(r.done ? 'stopped' : 'running', r.done ? 'closed' : 'open')
      : r.status == null ? (r.done ? pill('deny', 'failed') : el('span', { class: 'dim' }, 'pending'))
      : pill(r.action === 'deny' || r.status >= 400 ? 'deny' : 'allow', r.status);
    const url = el('span', {}, r.url, r.inspected ? '' : el('span', { class: 'dim' }, ' (' + r.scheme + ', not inspected)'));
    const tr = el('tr', { class: 'click' + (selectedReq === r.id ? ' sel' : ''), on: () => { selectedReq = r.id; showRequest(sessionId, r.id); renderNetwork(sessionId); } },
      el('td', { class: 'mono dim' }, r.id), el('td', { class: 'mono' }, r.method), el('td', { class: 'mono url' }, url), el('td', {}, status),
      el('td', { class: 'dim' }, (r.type || '').split(';')[0]), el('td', {}, size(r.resp_size)), el('td', {}, ms(r.total_ms)),
      el('td', { class: 'mono dim' }, r.rule || (r.action === 'deny' ? 'default' : '')));
    return tr;
  }));
  if (!list.length) $('net-body').replaceChildren(el('tr', {}, el('td', { colspan: '8', class: 'empty' }, 'no network activity')));
}
$('net-q').addEventListener('input', () => { if (tab === 'session') renderNetwork(current); });

let reqTab = 'headers';
async function showRequest(sessionId, n) {
  const r = await api('/sessions/' + sessionId + '/requests/' + n);
  const close = el('button', { class: 'act', on: () => { selectedReq = null; $('session-req').replaceChildren(); renderNetwork(sessionId); } }, 'Close');
  const dl = (pairs) => el('dl', {}, pairs.flatMap(([k, v]) => [el('dt', {}, k), el('dd', {}, v == null ? '' : String(v))]));
  const bodyView = (b) => {
    if (!b || !b.total) return el('div', { class: 'dim' }, 'no body');
    const note = el('div', { class: 'dim' }, size(b.total) + (b.encoding ? ', ' + b.encoding + ' (decoded)' : '') + (b.truncated ? ', first ' + size(b.kept) + ' kept' : ''));
    if (b.withheld) return el('div', {}, note, el('div', { class: 'deny' }, 'not shown: ' + b.withheld));
    if (b.text == null) return el('div', {}, note, el('div', { class: 'dim' }, 'binary, ' + size(b.kept) + ' kept'));
    let text = b.text;
    try { text = JSON.stringify(JSON.parse(b.text), null, 2); } catch {}
    return el('div', {}, note, el('pre', {}, text));
  };
  const panels = {
    headers: () => el('div', {},
      el('h2', {}, 'general'), dl([['request', r.method + ' ' + r.scheme + '://' + r.host + ':' + r.port + (r.path || '')], ['status', r.status],
        ['decision', r.action + (r.rule ? ' by ' + r.rule : ' by default') + (r.scope ? ' (' + r.scope + ')' : '')],
        ['secrets added', (r.secrets || []).join(', ') || 'none'], ['error', r.error]]),
      el('h2', {}, 'request headers (as the guest sent them)'), r.request_headers.length ? dl(r.request_headers) : el('div', { class: 'dim' }, r.inspected ? 'none' : 'not inspected: the connection was passed through encrypted'),
      el('h2', {}, 'response headers'), r.response_headers.length ? dl(r.response_headers) : el('div', { class: 'dim' }, 'none')),
    request: () => bodyView(r.request_body),
    response: () => bodyView(r.response_body),
    timing: () => dl([['started', new Date(r.ts * 1000).toLocaleTimeString()], ['first byte', ms(r.ttfb_ms)], ['total', ms(r.total_ms)],
      ['sent', size(r.req_size)], ['received', size(r.resp_size)]]),
  };
  const tabs = el('div', { class: 'tabs' }, Object.keys(panels).map(t => el('button', { class: t === reqTab ? 'on' : '', on: () => { reqTab = t; showRequest(sessionId, n); } }, t)));
  $('session-req').replaceChildren(
    el('div', { class: 'bar' }, el('h2', { style: 'margin:0' }, '#' + r.id + ' ' + r.method + ' ' + r.url), close),
    tabs, el('div', { class: 'panel' }, panels[reqTab]()));
}

// A session's terminal, live and read-only, beside its details: the open
// one, or the one picked below it. The frame is replaced only when the
// session or the terminal changes, so a refresh doesn't reconnect it.
let shownTerm = '', shownTerms = '', pickedTerm = null, termObserver = null, termFit = null;
function showTerminal(sessionId, terms) {
  const pick = terms.find(t => pickedTerm && pickedTerm.session === sessionId && t.id === pickedTerm.id)
    || terms.find(t => t.open) || terms[terms.length - 1];
  // The picker, rebuilt only when the list changes, so an open dropdown isn't closed by a refresh.
  const sig = sessionId + '|' + (pick ? pick.id : '') + '|' + terms.map(t => t.id + ':' + t.open + ':' + t.argv.join(' ')).join(',');
  if (sig !== shownTerms) {
    shownTerms = sig;
    const select = el('select', { title: 'the terminal to show' }, terms.map(t => {
      const o = el('option', { value: String(t.id) }, t.id + ': ' + t.argv.join(' ') + (t.open ? '' : ' (closed)'));
      if (t === pick) o.selected = true;
      return o;
    }));
    select.addEventListener('change', () => { pickedTerm = { session: sessionId, id: Number(select.value) }; showTerminal(sessionId, terms); });
    $('session-term-h').replaceChildren(...(terms.length ? [select] : []));
  }
  $('session-term-fh').replaceChildren(...(pick ? [
    el('button', { class: 'act pop', title: 'Open this terminal in its own window', on: () => watchTerminal(sessionId, pick) }, 'Pop out ↗')] : []));
  // The terminal's own size in the frame (xterm's 13px cells, its padding).
  const size = pick ? { w: pick.cols * 7.85 + 20, h: pick.rows * 17 + 20 } : null;
  const key = pick ? sessionId + '/' + pick.id : '';
  if (key === shownTerm) { if (size && termFit) termFit(size); return; }
  shownTerm = key;
  if (termObserver) { termObserver.disconnect(); termObserver = null; termFit = null; }
  if (!pick) { $('session-term-ff').style.height = ''; return $('session-term-ff').replaceChildren(el('div', { class: 'empty' }, 'no terminals')); }
  const f = el('iframe', { title: 'terminal ' + pick.id + ' of session ' + sessionId, tabindex: '-1' });
  f.src = '/terminal?session=' + encodeURIComponent(sessionId) + '&n=' + encodeURIComponent(pick.id) + '&embed=1';
  const box = el('div', { class: 'preview', title: 'click to show it full size' }, f, el('div', { class: 'veil' }));
  box.addEventListener('click', () => { box.classList.toggle('full'); fit(); });
  // A fixed width, the details' height (less the picker below), and the
  // whole terminal zoomed to fit, never past the real font size: a larger
  // terminal is drawn smaller.
  const ff = $('session-term-ff'), info = $('session-info'), picker = $('session-term-h');
  let cur = size;
  const fit = (next) => {
    if (next && next.w) cur = next;
    f.style.width = cur.w + 'px'; f.style.height = cur.h + 'px';
    if (!box.classList.contains('full')) {
      const below = picker.offsetHeight ? picker.offsetHeight + 10 : 0;
      ff.style.height = Math.max(160, Math.round(info.getBoundingClientRect().bottom - ff.getBoundingClientRect().top - below)) + 'px';
    }
    f.style.transform = 'scale(' + Math.min(box.clientWidth / cur.w, box.clientHeight / cur.h, 1) + ')';
  };
  termFit = fit;
  termObserver = new ResizeObserver(() => fit());
  termObserver.observe(info); termObserver.observe(box);
  ff.replaceChildren(box);
  fit();
}

// Each terminal opens in its own window; a second click focuses it.
function watchTerminal(sessionId, t) {
  const url = '/terminal?session=' + encodeURIComponent(sessionId) + '&n=' + encodeURIComponent(t.id);
  const width = Math.min(screen.availWidth, t.cols * 8 + 60), height = Math.min(screen.availHeight, t.rows * 17 + 90);
  const w = window.open(url, 'zapper-' + sessionId + '-' + t.id, 'width=' + width + ',height=' + height);
  if (w) w.focus();
}

async function renderApprovals() {
  const list = await api('/approvals');
  // Rebuild only when the list changes, so a choice being made isn't reset.
  const key = JSON.stringify(list.map(p => p.id)) + answerError;
  if (key === shownApprovals) return;
  shownApprovals = key;
  const error = answerError ? [el('p', { class: 'deny' }, answerError)] : [];
  if (!list.length) return $('approvals').replaceChildren(...error, el('div', { class: 'empty' }, 'Nothing is waiting for a decision.'));
  const row = (p) => {
    const select = el('select', {}, el('option', { value: '' }, 'this request'), el('option', { value: 'session' }, 'the rest of the session'));
    select.value = rememberChoice[p.id] || '';
    select.addEventListener('change', () => { rememberChoice[p.id] = select.value || null; });
    const allow = el('button', { class: 'act allow', on: () => { allow.disabled = deny.disabled = true; answer(p.id, true); } }, 'Allow');
    const deny = el('button', { class: 'act deny', on: () => { allow.disabled = deny.disabled = true; answer(p.id, false); } }, 'Deny');
    return el('tr', {}, el('td', { class: 'mono' }, p.id), el('td', { class: 'mono' }, sessionLink(p.session)), el('td', {}, p.kind),
      el('td', { class: 'mono' }, p.subject), el('td', {}, ago(p.created)), el('td', {}, select), el('td', {}, allow, ' ', deny));
  };
  $('approvals').replaceChildren(...error,
    el('p', { class: 'dim' }, 'An answer for the rest of the session adds an allow or deny rule to the session. It is kept in memory and ends with the session; the config is never changed.'),
    el('table', {}, el('thead', {}, el('tr', {}, ['id', 'session', 'kind', 'request', 'waiting', 'applies to', ''].map(h => el('th', {}, h)))),
      el('tbody', {}, list.map(row))));
}

function ruleText(r) {
  if (r.kind === 'net') return [r.host + (r.ports ? ':' + r.ports.join(',') : ''), r.methods ? r.methods.join(',') : '', r.path || '', r.secrets ? 'secrets: ' + r.secrets.join(',') : ''].filter(Boolean).join('  ');
  if (r.kind === 'exec') return r.path + (r.args ? '  args: ' + r.args : '');
  return r.path + '  ' + r.access;
}
async function renderRules() {
  const rules = await api('/rules');
  const groups = {};
  for (const r of rules) (groups[r.scope] = groups[r.scope] || []).push(r);
  const order = Object.keys(groups).sort((a, b) => (a.startsWith('session') ? 0 : a.startsWith('profile') ? 1 : 2) - (b.startsWith('session') ? 0 : b.startsWith('profile') ? 1 : 2) || a.localeCompare(b));
  $('rules').replaceChildren(
    el('p', { class: 'dim' }, 'Evaluation: final rules from global down, then session → profile → parent profiles → global; first match wins within a layer.'),
    ...order.map(scope => [el('h2', {}, scope),
      el('table', {}, el('thead', {}, el('tr', {}, ['id', 'kind', 'action', 'match', 'comment'].map(h => el('th', {}, h)))),
        el('tbody', {}, groups[scope].map(r => el('tr', {}, el('td', { class: 'mono' }, r.id, r.final ? ' ' : '', r.final ? pill('deny', 'final') : ''),
          el('td', {}, r.kind), el('td', {}, r.action ? pill(r.action) : pill('dim', r.access)), el('td', { class: 'mono' }, ruleText(r)), el('td', { class: 'dim' }, r.comment || '')))))]).flat());
}

async function renderConfig() {
  const view = $('cfg-view').value;
  const text = await api(view === 'running' ? '/config' : view === 'startup' ? '/config/startup' : '/config/diff');
  $('cfg-hint').textContent = view === 'diff' ? 'save with `zapper config save`, discard with `zapper config reload`' : 'secret values are redacted';
  const pre = $('cfg');
  if (view !== 'diff') return pre.replaceChildren(text);
  if (!text.trim()) return pre.replaceChildren('No unsaved changes.');
  pre.replaceChildren(...text.split('\n').map(l => el('div', { class: l.startsWith('+') ? 'diff-add' : l.startsWith('-') ? 'diff-del' : l.startsWith('@@') ? 'diff-hunk' : '' }, l)));
}
$('cfg-view').addEventListener('change', renderConfig);

// Live events.
const events = [];
function eventRow(e) {
  let action = e.action, detail = '', rule = e.rule || '';
  switch (e.type) {
    case 'net': detail = (e.method ? e.method + ' ' : 'connect ') + e.host + ':' + e.port + (e.path || '') + (e.status ? ' → ' + e.status : '') + (e.secrets ? '  [secrets: ' + e.secrets.join(',') + ']' : '') + (e.error ? '  ' + e.error : '') + (e.inspected ? '' : '  (tunnel)'); break;
    case 'exec': detail = e.argv.join(' ') + '  (' + e.wait_ms.toFixed(1) + ' ms)'; break;
    case 'ask': action = 'ask'; detail = e.id + ': ' + e.subject; break;
    case 'answer': action = e.allow ? 'allow' : 'deny'; detail = e.id + (e.remember ? ' · ' + e.remember : ''); break;
    case 'guest': { const x = e.event; detail = x.event === 'exit' ? x.comm + ' pid ' + x.pid + ' exit ' + (x.signal ? 'signal ' + x.signal : x.exit_code) + ' · ' + x.elapsed_ms + ' ms' : x.event === 'setup' ? (x.ok ? 'ok: ' : 'FAILED: ') + x.step : JSON.stringify(x); break; }
    case 'shell': detail = 'shell ' + e.id + ' ' + e.state + (e.argv ? ': ' + e.argv.join(' ') : '') + (e.exit_code != null ? ' exit ' + e.exit_code : ''); break;
    case 'dns': action = e.allowed ? 'allow' : 'deny'; detail = e.rcode + ' ' + (e.name || '(invalid query)') + (e.answer ? ' → ' + e.answer : '') + (e.reason ? '  (' + e.reason + ')' : ''); break;
    case 'session': detail = e.state + (e.detail ? ': ' + e.detail : ''); break;
    case 'config': detail = e.change; break;
  }
  return { e, action: action || '', detail, rule };
}
function renderEvents() {
  const s = $('ev-session').value, t = $('ev-type').value, a = $('ev-action').value, q = $('ev-q').value.toLowerCase();
  const rows = events.filter(r => (!s || r.e.session === s) && (!t || r.e.type === t) && (!a || r.action === a) && (!q || r.detail.toLowerCase().includes(q))).slice(-500).reverse();
  $('ev-count').textContent = rows.length + ' shown';
  $('ev-body').replaceChildren(...rows.map(r => el('tr', {}, el('td', {}, time(r.e.ts)), el('td', { class: 'mono' }, sessionLink(r.e.session)), el('td', {}, r.e.type),
    el('td', {}, r.action ? pill(r.action) : ''), el('td', { class: 'mono' }, r.detail), el('td', { class: 'mono dim' }, r.rule))));
}
for (const id of ['ev-session', 'ev-type', 'ev-action']) $(id).addEventListener('change', renderEvents);
$('ev-q').addEventListener('input', renderEvents);
let pending = false;
const es = new EventSource('/api/events?history=true');
es.onmessage = (m) => {
  events.push(eventRow(JSON.parse(m.data)));
  if (events.length > 5000) events.splice(0, 1000);
  if (!pending) { pending = true; setTimeout(() => { pending = false; if (tab === 'events') renderEvents(); }, 250); }
};

show('sessions');
setInterval(refresh, 3000);
</script>
</body>
