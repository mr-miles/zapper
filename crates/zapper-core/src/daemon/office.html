<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>zapper office</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#F5F4EE; --panel:#FAF9F5; --card:#FFFFFF; --line:#E8E6DC; --line2:#D6D2C4;
    --text:#2F2C24; --muted:#83807A; --accent:#D97757; --accent-ink:#B85C3E; --accent-soft:rgba(217,119,87,.12);
    --ok:#5E8D5A; --bad:#C2493D; --warn:#B7862C; --info:#5B86A8;
    --head:#F1E6D6; --eye:#3D3929; --av-stroke:#3D3929; --paper:#FFFDF8; --screen:#2E2C28;
    --s-off:#DEDBD0; --s-booting:#C9C2B3; --s-idle:#A3B18A; --s-waiting:#D9AE5B; --s-queued:#86A9C6;
    --s-working:#D97757; --s-reviewing:#B07AA1; --s-over:#8E8375; --s-error:#C2493D;
    --shadow: 0 1px 2px rgba(60,50,30,.06), 0 4px 14px rgba(60,50,30,.05);
    --serif: ui-serif, Georgia, Cambria, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#262624; --panel:#1F1E1D; --card:#2C2B29; --line:#3A3936; --line2:#4A4844;
      --text:#ECEAE3; --muted:#A29F95; --accent:#D97757; --accent-ink:#E8916F; --accent-soft:rgba(217,119,87,.16);
      --ok:#8DB889; --bad:#E07A6F; --warn:#D9AE5B; --info:#8DB3D3;
      --head:#E6D8C4; --eye:#2A2724; --av-stroke:#D3CBBE; --paper:#EFE9DE; --screen:#171614;
      --s-off:#3E3C38; --s-booting:#6A655C; --shadow: 0 1px 2px rgba(0,0,0,.25), 0 4px 14px rgba(0,0,0,.2);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font: 14px/1.5 var(--sans); background:var(--bg); color:var(--text); }
  h1, h2, h3, h4, .serif { font-family: var(--serif); font-weight: 500; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent-ink); }
  .mono, code, pre { font-family: var(--mono); font-size: 12.5px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .hidden { display: none !important; }

  /* header */
  header { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
  .hrow { display:flex; align-items:center; gap:14px; padding: 12px 24px; flex-wrap: wrap; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand h1 { margin:0; font-size: 21px; letter-spacing: .1px; }
  .brand .desc { color: var(--muted); font-size: 13px; max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spark-logo { width: 22px; height: 22px; }
  .hstats { display:flex; align-items:center; gap:10px; margin-left: 6px; flex-wrap: wrap; }
  .pill { display:inline-flex; align-items:center; gap:5px; padding: 1px 9px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line2); color: var(--muted); background: var(--panel); white-space: nowrap; }
  .pill.running, .pill.allow, .pill.allowed, .pill.closed { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .pill.paused, .pill.waiting, .pill.pending, .pill.starting, .pill.ask, .pill.escalated, .pill.stopping { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .pill.failed, .pill.deny, .pill.denied, .pill.overdue, .pill.error { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .pill.accent, .pill.assignment { color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: var(--accent-soft); }
  .pill.question { color: var(--info); border-color: color-mix(in srgb, var(--info) 45%, transparent); }
  .pill.report { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .pill.follow-up { color: var(--warn); border-style: dashed; }
  .badge { display:inline-flex; align-items:center; justify-content:center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; }
  .badge.warn { background: var(--warn); }
  .btn { border: 1px solid var(--line2); background: var(--card); border-radius: 9px; padding: 5px 13px; cursor: pointer; transition: background .15s, border-color .15s; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--accent-ink); }
  .btn.danger { color: var(--bad); }
  .btn.ok { color: var(--ok); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.small { padding: 2px 9px; font-size: 12px; border-radius: 7px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .linkish { color: var(--accent-ink); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; background: none; border: 0; padding: 0; }
  input[type=text], input[type=search], input[type=number], input:not([type]), select, textarea { background: var(--card); border: 1px solid var(--line2); border-radius: 9px; padding: 5px 10px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { width: 100%; resize: vertical; min-height: 110px; line-height: 1.45; }
  .menu { position: relative; }
  .menu > summary { list-style: none; cursor: pointer; }
  .menu > summary::-webkit-details-marker { display: none; }
  .menu .pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); min-width: 300px; max-height: 60vh; overflow: auto; padding: 6px; z-index: 30; }
  .menu .pop .item { display:flex; justify-content: space-between; gap: 12px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .menu .pop .item:hover { background: var(--accent-soft); }
  nav.tabs { display:flex; gap: 2px; padding: 4px 20px 0; }
  nav.tabs button, nav.tabs a { background: none; border: 0; border-bottom: 3px solid transparent; border-radius: 8px 8px 0 0; padding: 9px 16px 9px; cursor: pointer; color: var(--text); opacity: .72; font: inherit; font-size: 15px; font-weight: 500; text-decoration: none; display:inline-flex; align-items:center; gap:6px; transition: background .15s, opacity .15s; }
  nav.tabs button.on { opacity: 1; color: var(--accent-ink); border-bottom-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  nav.tabs button:hover, nav.tabs a:hover { opacity: 1; background: color-mix(in srgb, var(--line) 60%, transparent); }
  nav.tabs button.on:hover { background: var(--accent-soft); }
  nav.tabs .right { margin-left: auto; }
  .replaybar { display:flex; align-items:center; gap: 10px; padding: 8px 24px; background: var(--accent-soft); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .replaybar .close { margin-left: 4px; font-size: 16px; line-height: 1; padding: 4px 10px; }
  .replaybar .title { font-family: var(--serif); font-size: 15px; }
  .replaybar input[type=range] { flex: 1; min-width: 200px; accent-color: var(--accent); }
  .seg { display:inline-flex; border: 1px solid var(--line2); border-radius: 9px; overflow: hidden; }
  .seg button { border: 0; background: var(--card); padding: 3px 10px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }

  main { padding: 22px 24px 70px; }
  /* footer: the run's vital numbers, on every tab */
  footer.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: 32px; display: flex; align-items: center; gap: 18px; padding: 0 24px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  footer.foot .fi { cursor: pointer; display: inline-flex; gap: 5px; align-items: baseline; border-radius: 6px; padding: 1px 4px; transition: background .6s ease; }
  footer.foot .fi:hover { color: var(--text); }
  footer.foot .fi b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  footer.foot .fi.warn b { color: var(--bad); }
  footer.foot .fi.bump { background: var(--accent-soft); transition: none; }
  footer.foot .sep { color: var(--line2); }
  footer.foot a.right { margin-left: auto; color: var(--muted); text-decoration: none; }
  footer.foot a.right:hover { color: var(--text); }
  section.tab { display: none; } section.tab.on { display: block; }
  h2.sec { font-size: 18px; margin: 26px 0 10px; }
  h2.sec:first-child { margin-top: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi .k { color: var(--muted); font-size: 12px; } .kpi .v { font-family: var(--serif); font-size: 24px; }
  .empty { color: var(--muted); padding: 22px; text-align: center; }
  .bar { display:flex; gap: 8px; align-items:center; flex-wrap: wrap; margin-bottom: 12px; }
  table.t { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table.t th, table.t td { text-align: left; padding: 7px 11px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.t tr:last-child td { border-bottom: 0; }
  table.t th { color: var(--muted); font-weight: 500; font-size: 12px; background: var(--panel); }
  table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--accent-soft); }
  table.t td.wrap { word-break: break-all; }
  pre.json { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow: auto; max-height: 50vh; margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
  .toast { position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--line2); border-radius: 12px; padding: 10px 16px; box-shadow: var(--shadow); z-index: 100; max-width: 80vw; }
  .toast.bad { border-color: var(--bad); color: var(--bad); }
  /* Fixed columns: wide content (long lines, tables, diffs) scrolls inside its box instead of widening the page. */
  .split { display:grid; grid-template-columns: 380px minmax(0, 1fr); gap: 18px; align-items: start; }
  .split > * { min-width: 0; }
  @media (max-width: 960px) { .split { grid-template-columns: minmax(0, 1fr); } }
  .list { display:flex; flex-direction: column; gap: 6px; }
  .li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; cursor: pointer; }
  .li:hover { border-color: var(--line2); }
  .li.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .li .top { display:flex; gap: 8px; align-items: center; justify-content: space-between; }
  .li .subj { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li .meta { color: var(--muted); font-size: 12px; display:flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display:inline-block; flex: none; }
  label.f { display:flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  label.f > input, label.f > select, label.f > textarea { color: var(--text); font-size: 14px; }
  .form { display:flex; flex-direction: column; gap: 10px; }
  .row2 { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; color: var(--accent-ink); }
  .chips { display:flex; flex-wrap: wrap; gap: 6px; }
  .unread-box { margin-top: 12px; padding: 4px 12px 10px; border: 1px solid var(--line2); border-left: 3px solid var(--accent); border-radius: 10px; background: var(--accent-soft); }
  .unread-box h3 { margin-top: 8px; }
  /* The panel's collapsed groups: a heading with a count. */
  details.grp { margin-top: 18px; }
  details.grp > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; padding: 4px 0; }
  details.grp > summary::-webkit-details-marker { display: none; }
  details.grp > summary::before { content: '▸'; color: var(--muted); font-size: 12px; transition: transform .15s; }
  details.grp[open] > summary::before { transform: rotate(90deg); }
  details.grp[open] > summary { margin-bottom: 8px; }
  details.grp .cnt { font-size: 12px; font-weight: 600; min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 10px; background: var(--line); color: var(--muted); }
  details.grp .cnt.hot { background: var(--accent); color: #fff; }
  details.grp.unread-box { padding: 4px 12px 6px; }
  .bdg .ic.mail { cursor: pointer; }
  .more-row { display:flex; gap: 10px; align-items: center; justify-content: center; margin: 10px 0; }
  /* Messages: the filters fill the column, two to a row; search spans it */
  #msg-filters { display:grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  #msg-filters > select, #msg-filters > input { width: 100%; min-width: 0; margin: 0; }
  #msg-filters > input[type=search], #msg-filters > label { grid-column: 1 / -1; }
  #msg-filters.hidden { display: none; }
  .attach-row { display:flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 2px 0 6px; }
  .chip { border: 1px solid var(--line2); border-radius: 999px; padding: 1px 10px; font-size: 12px; cursor: pointer; background: var(--panel); }
  .chip:hover { border-color: var(--accent); }
  .picker { max-height: 140px; overflow: auto; border: 1px solid var(--line2); border-radius: 9px; padding: 6px 8px; background: var(--card); }
  .picker label { display:flex; gap: 6px; align-items: center; font-size: 13px; color: var(--text); }

  /* overview */
  .ovwrap { position: relative; }
  .ovhead { display:flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .stagebox { position: relative; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 0; }
  .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .stage svg.edges { position: absolute; left: 0; top: 0; overflow: visible; }
  .stage svg.edges path { fill: none; stroke: var(--line2); stroke-width: 1.5; }
  .node { position: absolute; width: 176px; height: 156px; display:flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; border-radius: 16px; padding: 6px 6px 8px; transition: background .2s; }
  .node:hover { background: var(--accent-soft); }
  .node.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .node .nm { font-weight: 600; line-height: 1.2; margin-top: 2px; }
  .node .tt { color: var(--muted); font-size: 12px; line-height: 1.2; }
  .node .st { font-size: 12px; line-height: 1.25; margin-top: 3px; max-width: 168px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); opacity: .85; }
  .node .st.bad { color: var(--bad); }
  .node .bdg { position: absolute; top: 4px; right: 22px; display:flex; flex-direction: column; gap: 3px; align-items: flex-start; }
  .node .bdg .ic { display:inline-flex; align-items:center; gap: 2px; font-size: 11px; background: var(--card); border: 1px solid var(--line2); border-radius: 999px; padding: 0 6px; height: 19px; }
  .node .bdg .ic.mail { background: var(--accent); color: #fff; border-color: var(--accent); }
  .node .bdg .ic.lock { color: var(--warn); }
  .node .bdg .ic.clock { color: var(--bad); }
  .node .bdg svg { width: 11px; height: 11px; }
  .node .rm-state { display: none; font-size: 11px; color: var(--muted); }
  .env { position: absolute; left: 0; top: 0; width: 22px; height: 16px; margin: -8px 0 0 -11px; pointer-events: none; z-index: 5; }
  .env svg { width: 22px; height: 16px; display:block; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.18)); }
  .legend { display:flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .legend i { display:inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

  /* side panel */
  .git-crumbs { font-size: 15px; margin: 4px 0 10px; }
  .git-empty-card { max-width: 640px; margin: 40px auto; padding: 36px 40px; text-align: center; }
  .git-empty-card h2 { margin: 18px 0 6px; font-size: 24px; }
  .git-empty-card p { margin: 0 auto 22px; max-width: 460px; }
  .git-art { width: 220px; height: auto; }
  .git-art .gl { fill: none; stroke-width: 4; stroke-linecap: round; }
  .git-art .gl.main { stroke: var(--line2); }
  .git-art .gl.side { stroke: var(--accent); stroke-dasharray: 6 7; opacity: .7; }
  .git-art .gd { stroke: var(--card); stroke-width: 3; }
  .git-art .gd.main { fill: var(--muted); }
  .git-art .gd.side { fill: var(--accent); }
  .git-art .gd.ghost { fill: var(--card); stroke: var(--line2); stroke-dasharray: 3 3; }
  @media (prefers-reduced-motion: no-preference) { .git-art .gl.side { animation: gitdash 3s linear infinite; } }
  @keyframes gitdash { to { stroke-dashoffset: -26; } }
  .git-empty-rows { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 12px; align-items: center; text-align: left; }
  .git-empty-rows code { font-family: var(--mono); font-size: 12.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; overflow-x: auto; white-space: nowrap; }
  .git-crumbs a, a.link { cursor: pointer; }
  .git-tree { padding: 6px 0; }
  .git-row { display:grid; grid-template-columns: 18px 1fr auto; gap: 8px; padding: 6px 16px; cursor: pointer; align-items: baseline; }
  .git-row:hover { background: var(--accent-soft); }
  .git-ic { color: var(--muted); }
  .git-dir { font-weight: 600; }
  .git-pre { white-space: pre; overflow: auto; max-height: 70vh; margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .git-msg { white-space: pre-wrap; font-family: var(--sans); margin: 8px 0; }
  .git-files { margin: 10px 0; display:flex; flex-direction: column; gap: 2px; }
  .git-diff .dadd, .git-files .dadd { color: var(--ok); }
  .git-diff .ddel, .git-files .ddel { color: var(--bad); }
  .git-diff .dhunk { color: var(--info); }
  .git-diff .dh { font-weight: 600; }
  .commits .c.sel { background: var(--accent-soft); }
  .gc { display:grid; grid-template-columns: minmax(0,1fr) auto; column-gap: 10px; padding: 5px 8px; border-bottom: 1px dashed var(--line); cursor: pointer; border-radius: 6px; }
  .gc:last-child { border-bottom: 0; }
  .gc:hover { background: var(--panel); }
  .gc.sel { background: var(--accent-soft); }
  .gc .s { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gc .d { grid-column: 1 / -1; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gc .r { font-size: 11.5px; color: var(--muted); text-align: right; white-space: nowrap; }
  .git-readme { margin-top: 12px; padding: 16px 20px; }
  .git-readme .h { font-size: 12px; color: var(--muted); margin-bottom: 8px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .msg.focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .msg.hit { background: var(--accent-soft); }
  .vhist { display:flex; flex-direction: column; gap: 2px; margin: 4px 0 10px; border-left: 2px solid var(--line2); }
  .vrow { display:grid; grid-template-columns: 42px 1fr auto; gap: 8px; padding: 4px 10px; cursor: pointer; border-radius: 0 8px 8px 0; align-items: baseline; }
  .vrow:hover { background: var(--accent-soft); }
  .vrow.sel { background: var(--accent-soft); }
  .vrow.sel .vnum { color: var(--accent-ink); font-weight: 600; }
  .vnum { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  /* the scenario's next step: a second line, under the logo */
  .hscen { display:flex; align-items:center; gap: 8px; padding: 0 24px 10px; margin-top: -4px; }
  .hlinks { margin-left: auto; display:flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hlinks a { text-decoration: none; }
  .vm-dash { display:flex; gap: 8px; align-items: center; }
  /* the organization, with its legend as a list on the right */
  .ovrow { display:flex; gap: 14px; align-items: flex-start; }
  .ovrow .stagebox { flex: 1; min-width: 0; }
  .legend.side { flex-direction: column; flex-wrap: nowrap; gap: 5px; margin-top: 0; width: 190px; flex: none; }
  .legend.side h4 { margin: 6px 0 0; font-size: 12px; color: var(--text); font-weight: 600; }
  .legend.side h4:first-child { margin-top: 0; }
  .legend.side .lg { display:flex; align-items: center; gap: 6px; }
  .legend .gauge { display:inline-block; width: 26px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; flex: none; }
  .legend .gauge i { display:block; height: 100%; margin: 0; border-radius: 0; vertical-align: 0; }
  .legend .ic { display:inline-flex; align-items:center; gap: 2px; font-size: 11px; background: var(--card); border: 1px solid var(--line2); border-radius: 999px; padding: 0 6px; height: 17px; flex: none; }
  .legend .ic.mail { background: var(--accent); color: #fff; border-color: var(--accent); }
  .legend .ic.lock { color: var(--warn); }
  .legend .ic.clock { color: var(--bad); }

//
// A tidy top-down tree: leaves take consecutive slots, a parent sits over
// the middle of its children. The board is the root; workers without a
// (known) manager, and any caught in a reporting cycle, hang under it.

  const kidsOf = () => {
    const k = new Map([[BOARD, []]]);
    for (const w of workers) k.set(w.name, []);
    for (const w of workers) k.get(parent.get(w.name)).push(w.name);
    return k;
  };
  let kids = kidsOf();
  for (;;) {
    const reach = new Set(), stack = [BOARD];
    while (stack.length) { const n = stack.pop(); if (reach.has(n)) continue; reach.add(n); stack.push(...kids.get(n)); }
    const lost = workers.find((w) => !reach.has(w.name));
    if (!lost) break;
    parent.set(lost.name, BOARD);
    kids = kidsOf();
  }
  const pos = new Map();
  let slot = 0, maxDepth = 0;
  const place = (n, depth) => {
    maxDepth = Math.max(maxDepth, depth);
    const ks = kids.get(n);

    if (!ks.length) x = slot++;
    else { for (const k of ks) place(k, depth + 1); x = (pos.get(ks[0]).slot + pos.get(ks[ks.length - 1]).slot) / 2; }

  };
  place(BOARD, 0);
  return { pos, parent, width: Math.max(1, slot) * (NW + GX) - GX, height: (maxDepth + 1) * (NH + GY) - GY };
}

  const centre = (n) => { const p = OV.lay.pos.get(n); return p ? { x: p.x + NW / 2, y: p.y + 38 } : null; };

    env.style.transform = frames[0].transform;
    stage.append(env);
    const anim = env.animate(frames, { duration: 1100 + i * 120, easing: 'ease-in-out', delay: i * 60 });
    anim.onfinish = () => env.remove();
    anim.oncancel = () => env.remove();
  });
}

// ─────────────────────────────── work ───────────────────────────────
//
// Assignments as tickets, derived from the mail: an assignment is a ticket
// for each recipient, a report closes it, and the thread it was sent from
// makes it a sub-task. Nothing here is written by workers.

const WORK = { view: 'board', owner: '', sig: null };
const WORK_COLS = [['todo', 'To do'], ['doing', 'In progress'], ['waiting', 'Waiting on others'], ['done', 'Done']];

function tickets(M, now) {
  const list = [...M.obl.values()].filter((o) => o.expects === 'done').map((o) => {
    const t = M.threads.get(o.thread) || {};
    const m = M.mails.get(o.message) || {};
    return { o, id: o.key, thread: o.thread, message: o.message, owner: o.debtor, by: o.creditor, subject: m.subject || t.subject || '(no subject)',
      created: o.created, due: o.due, end: o.settled ? o.settled.ts : null, parent: null, kids: [] };
  });
  const byThread = new Map();
  for (const k of list) { if (!byThread.has(k.thread)) byThread.set(k.thread, []); byThread.get(k.thread).push(k); }
  // The parent: in the thread the assignment was sent from, the ticket its
  // sender owed there (or any ticket of that thread).
  for (const k of list) {
    const t = M.threads.get(k.thread);
    const cands = t && t.context && t.context !== k.thread ? byThread.get(t.context) || [] : [];
    const p = cands.find((x) => x.owner === k.by) || cands[0];
    if (p && p !== k) { k.parent = p; p.kids.push(k); }
  }
  for (const k of list) {
    const w = M.workers.get(k.owner);
    k.overdue = !k.end && k.due && now > k.due;
    k.working = !k.end && !!(w && w.inTurn && w.turnThreads.has(k.thread));
    k.openKids = k.kids.filter((x) => !x.end).length;
    k.status = k.end ? 'done' : k.working ? 'doing' : k.openKids ? 'waiting' : w && w.unread.has(k.message) ? 'todo' : 'doing';
  }
  return list;
}

    }
    if (w.left) {
      log.push({ ts: w.left.ts, kind: 'left', who: w.name, text: cap(w.name) + ' let go by ' + (w.left.by === BOARD ? 'the board' : who(M, w.left.by)) + (w.left.returned ? '; ' + fmtTok(w.left.returned) + ' tokens back to ' + who(M, w.left.to) : ''), note: w.left.reason });
    }
  }
  for (const c of M.screenings.values()) {
    if (c.state === 'pending') continue;
    log.push({ ts: c.decided || c.ts, kind: c.state, who: c.worker, text: 'Background check of ' + cap(c.worker) + ' ' + c.state + ' by ' + (c.decidedBy === BOARD ? 'the board' : who(M, c.decidedBy)), note: c.note });
  }
  for (const c of M.contracts.values()) {

    svg.append(g);

    el('div', { class: 'legend' },

//
// What the board's script does next and how close it is, from the journal:
// the steps that played or failed, what a due step waits for, and its

function durSecs(d) {

  return m ? Number(m[1]) * ({ s: 1, m: 60, h: 3600, d: 86400 }[m[2] || 's']) : null;

    const tok = ws.reduce((n, w) => n + w.tokens, 0);
    item('turns', 'stats', [[M.turns.length, 'turns'], [fmtNum(tok), 'tokens']]);
    if (M.started) item('time', 'stats', [[fmtDur(Math.max(0, now - M.started)), S.mode === 'replay' ? 'into the run' : 'running']]);
    footCommits();
  }
  const els = [];
  for (const it of items) {
    if (els.length) els.push(el('span', { class: 'sep' }, '·'));
    const kids = [];
    it.parts.forEach(([v, l], i) => { if (i) kids.push(el('span', {}, ' ')); kids.push(el('b', {}, String(v)), el('span', {}, l)); });
    const e = el('span', { class: 'fi' + (it.warn ? ' warn' : ''), title: 'Open ' + (TABS.find(([t]) => t === it.tab) || [, it.tab])[1], onclick: () => showTab(it.tab) }, ...kids);
    const sig = it.parts.map(([v]) => v).join('|');
    const was = FOOT.prev.get(it.key);
    if (was != null && was !== sig && it.key !== 'time') { e.classList.add('bump'); setTimeout(() => e.classList.remove('bump'), 1200); }
    FOOT.prev.set(it.key, sig);
    els.push(e);
  }
  // zapper's own pages, under the office.
  const a = el('a', { class: 'right', title: 'zapper, the sandbox the office runs on: every session, its network, terminals and approvals' }, 'zapper sessions ↗');
  a.href = sessionsHref();
  const sig = (S.firm || '') + '#' + items.map((it) => it.key + ':' + it.parts.map(([v]) => v).join('|') + (it.warn ? '!' : '')).join(',');
  if (foot.dataset.sig === sig) return;
  foot.dataset.sig = sig;
  foot.replaceChildren(...els, a);
}
// The commits on main, across the run's repositories: polled while live,
// read once for a replay.
async function footCommits() {
  const run = S.run;
  if (FOOT.busy || (FOOT.logRun === run && (S.mode === 'replay' || Date.now() - FOOT.logAt < 15000))) return;
  FOOT.busy = true; FOOT.logAt = Date.now();
  let log = [];
  try {
    for (const repo of arr(await gitFetch('/repos', null)).map(str)) {
      if (arr(await gitFetch('/branches', repo)).some((x) => x.name === 'main')) log = log.concat(arr(await gitFetch('/log?ref=main&limit=1000', repo)));
    }
  } catch (e) { /* no repository */ }
  FOOT.busy = false;
  if (run !== S.run) return;
  FOOT.log = log.map((c) => ({ ts: c.ts })); FOOT.logRun = run;
  scheduleRender();
}

async function firmOp(op, body) {
  try {
    await write('POST', F() + '/' + op, body === undefined ? {} : body);
    toast(op === 'up' ? 'Starting ' + S.firm + '…' : op === 'down' ? 'Stopping ' + S.firm + '…' : body && body.paused ? 'Paused' : 'Resumed');
  } catch (e) { toast(e.message, true); }
  loadFirm();
}

// ────────────────────────────── tabs ──────────────────────────────

function showTab(t) {
  if (!TABS.some(([x]) => x === t)) t = 'overview';
  if (t === 'runs' && S.tab !== 'runs') { S.prevTab = S.tab; RUNS.at = 0; }
  S.tab = t;
  for (const s of document.querySelectorAll('section.tab')) s.classList.toggle('on', s.id === 'tab-' + t);
  for (const b of $('tabs').querySelectorAll('button')) b.classList.toggle('on', b.dataset.t === t);
  setHash();
  if (t === 'overview') { OV.sig = null; }
  placePanel();
  if (t === 'security') pollSecurity();
  if (t === 'vms') { VM.sig = null; pollVms(); }
  render();
  if (t === 'overview') requestAnimationFrame(fitOverview);
}
function mountAll() {
  mountKickoff(); mountOverview(); mountPeople(); mountWork(); mountRuns(); mountMessages(); mountSecurity(); mountDrive(); mountGit(); mountStats(); mountVms();
  MSG.thread = null; MSG.treeRoot = null; MSG.compose = false; MSG.reply = null;
  DRV.sel = null; SEC.traffic = []; SEC.trafficAt = 0; S.security = null;
}
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
function render() {
  syncOff();
  renderHeader();
  renderFooter();
  if (S.tab === 'overview') syncOverviewOff();
  // The VMs are the daemon's, not the firm's: shown with or without a run.
  if (S.tab === 'vms') { try { updateVms(); } catch (e) { console.error(e); } }
  if (!S.M) return;
  try {
    if (S.tab === 'overview') updateOverview();
    else if (S.tab === 'people') updatePeople();
    else if (S.tab === 'work') updateWork();
    else if (S.tab === 'kickoff') updateKickoff();
    else if (S.tab === 'runs') updateRuns();
    else if (S.tab === 'messages') updateMessages();
    else if (S.tab === 'security') updateSecurity();
    else if (S.tab === 'drive') updateDrive();
    else if (S.tab === 'git') updateGit();
    else if (S.tab === 'stats') updateStats();
    updatePanel();
  } catch (e) { console.error(e); toast('page error: ' + e.message, true); }
  if (S.mode === 'replay') updateReplayBar();
}

// ─────────────────────────── URL hash ───────────────────────────

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  return { firm: p.get('firm'), tab: p.get('tab'), replay: p.get('replay') };
}
function setHash() {
  const p = new URLSearchParams();
  if (S.firm) p.set('firm', S.firm);
  if (S.tab !== 'overview') p.set('tab', S.tab);
  if (S.mode === 'replay' && S.run) p.set('replay', S.run);
  const h = '#' + p.toString();
  if (location.hash !== h) history.replaceState(null, '', h);
}
async function applyHash() {
  const h = readHash();
  if (h.firm && h.firm !== S.firm && S.firms.some((f) => f.name === h.firm)) await switchFirm(h.firm, true);
  if (h.replay && (S.mode !== 'replay' || S.run !== h.replay)) enterReplay(h.replay);
  else if (!h.replay && S.mode === 'replay') backToLive();
  if (h.tab && h.tab !== S.tab) showTab(h.tab);
}
window.addEventListener('hashchange', applyHash);

// ───────────────────────────── live ─────────────────────────────

function stopLive() {
  if (S.es) { S.es.close(); S.es = null; }
}
function modelFromInfo(info) {
  const M = newModel();
  setChart(M, { board: info.board, description: info.description, workers: arr(info.chart) });
  return M;
}
async function startLive(run) {
  stopLive();
  const gen = ++S.gen;
  closePanel();
  S.run = run; S.seen = new Set(); S.boardUnread = new Set();
  S.M = S.info ? modelFromInfo(S.info) : newModel();
  mountAll();
  let bytes = 0;
  try {
    const text = await api(runPath(run) + '/journal');
    if (gen !== S.gen) return;
    const c = completeBytes(typeof text === 'string' ? text : '');
    bytes = c.bytes;
    for (const e of parseLines(c.text)) ingest(e, false);
  } catch (e) { /* not written yet: follow from the start */ }
  if (gen !== S.gen) return;
  S.es = new EventSource('/api' + runPath(run) + '/journal?follow=true&from=' + bytes);
  S.es.onmessage = (ev) => {
    if (gen !== S.gen) return;
    let e;
    try { e = JSON.parse(ev.data); } catch (x) { return; }
    ingest(e, true);
  };
  scheduleRender();
  refreshUnread();
}
function ingest(e, fresh) {
  if (!e || typeof e !== 'object') return;
  if (e.seq != null) { if (S.seen.has(e.seq)) return; S.seen.add(e.seq); }
  apply(S.M, e);
  if (!fresh) return;
  if (e.type === 'mail') {
    const m = S.M.mails.get(e.id);
    if (m) { flyMail(m); if (m.to.includes(BOARD) || m.cc.includes(BOARD)) S.boardUnread.add(m.id); }
  }
  if (e.type === 'access' && S.tab === 'security') pollSecurity();
  scheduleRender();
}
async function refreshUnread() {
  if (!live() || !S.info || !S.info.run || ['ended', 'failed'].includes(str(S.info.run.state))) { S.boardUnread = new Set(); return; }
  const gen = S.gen;
  try {
    const list = arr(await api(F() + '/mail?for=board&unread=true'));
    if (gen === S.gen) S.boardUnread = new Set(list.map((m) => str(m.id)));
  } catch (e) { /* no run */ }
}
async function loadFirm() {
  if (!S.firm) return;
  const firm = S.firm, gen = S.gen;
  let info;
  try { info = await api(F()); } catch (e) { toast(e.message, true); return; }
  if (firm !== S.firm) return;
  S.info = info;
  if (S.mode === 'live' && gen === S.gen) {
    // The live view follows the active run only: a stopped one is discarded
    // here (its mail, unread marks, budget) and lives on in Runs and replay.
    const active = info.run && !['ended', 'failed'].includes(str(info.run.state)) ? str(info.run.run) : null;
    const run = active;
    // When the company stops (or another run takes its place), nothing of
    // it may linger in the page: start over with a fresh one, on Kickoff.
    // The Kickoff form's stop-and-start reloads itself once the new run is up.
    if (S.activeRun && active !== S.activeRun && !KO.busy) { resetPage(); return; }
    S.activeRun = active;
    if (run && run !== S.run) { startLive(run); return; }
    if (!run && (S.run || !S.M)) { stopLive(); S.gen++; S.run = null; S.boardUnread = new Set(); closePanel(); S.M = modelFromInfo(info); mountAll(); }
    if (run) await refreshUnread();
  }
  scheduleRender();
}
function resetPage() {
  stopLive(); stopReplay();
  S.tab = 'kickoff'; S.mode = 'live';
  setHash();
  location.reload();
}
async function loadFirms() {
  try { S.firms = arr(await api('/firms')); } catch (e) { toast(e.message, true); S.firms = []; }
}
async function switchFirm(name, fromHash) {
  stopLive(); stopReplay();
  S.gen++;
  S.firm = name; S.info = null; S.run = null; S.M = null; S.mode = 'live'; S.boardUnread = new Set(); S.activeRun = null;
  closePanel();
  $('replaybar').classList.add('hidden');
  mountAll();
  if (!fromHash) setHash();
  await loadFirm();
}

// ───────────────────────────── replay ─────────────────────────────
//
// The whole journal is loaded and folded up to the timeline position;
// moving back starts the fold over. Writes are off.

function stopReplay() {
  if (S.rp && S.rp.timer) clearInterval(S.rp.timer);
  if (S.rp) S.rp.timer = null;
}
async function enterReplay(run) {
  // Where ✕ returns to: the tab before Runs (or before this replay).
  if (S.mode !== 'replay') S.returnTab = S.tab === 'runs' ? S.prevTab || 'overview' : S.tab;
  stopLive(); stopReplay();
  const gen = ++S.gen;
  closePanel();
  S.mode = 'replay'; S.run = run; S.M = newModel(); S.seen = new Set(); S.rp = null;
  mountAll();
  if (S.tab === 'runs') showTab('overview');
  setHash();
  let text;
  try { text = await api(runPath(run) + '/journal'); } catch (e) { toast('Can\'t open run ' + run + ': ' + e.message, true); if (gen === S.gen) backToLive(); return; }
  if (gen !== S.gen) return;
  const events = parseLines(typeof text === 'string' ? text : '').filter((e) => isFinite(Number(e.ts)))
    .map((e, i) => [e, i]).sort((a, b) => Number(a[0].ts) - Number(b[0].ts) || a[1] - b[1]).map(([e]) => Object.assign(e, { ts: Number(e.ts) }));
  if (!events.length) { toast('Run ' + run + ' has no events.', true); backToLive(); return; }
  S.rp = { events, idx: 0, t0: events[0].ts, t1: events[events.length - 1].ts, pos: events[0].ts, playing: false, speed: 10, timer: null, skip: false, last: 0 };
  buildReplayBar();
  seek(S.rp.t0, false);
}
function backToLive() {
  stopReplay();
  S.gen++;
  S.mode = 'live'; S.rp = null; S.run = null; S.M = null;
  closePanel();
  $('replaybar').classList.add('hidden');
  mountAll();
  showTab(S.returnTab || 'overview');
  S.returnTab = null;
  loadFirm();
}
function seek(t, animate) {
  const rp = S.rp;
  if (!rp) return;
  t = Math.max(rp.t0, Math.min(rp.t1, t));
  if (t < rp.pos || !S.M || rp.idx === 0) { S.M = newModel(); rp.idx = 0; }
  const mails = [];
  while (rp.idx < rp.events.length && rp.events[rp.idx].ts <= t) {
    const e = rp.events[rp.idx++];
    apply(S.M, e);
    if (animate && e.type === 'mail') mails.push(e.id);
  }
  rp.pos = t;
  for (const id of mails.slice(-12)) { const m = S.M.mails.get(id); if (m) flyMail(m); }
  scheduleRender();
}
function play(on) {
  const rp = S.rp;
  if (!rp) return;
  if (on && rp.pos >= rp.t1) seek(rp.t0, false);
  rp.playing = on;
  if (rp.timer) { clearInterval(rp.timer); rp.timer = null; }
  if (on) {
    rp.last = performance.now();
    rp.timer = setInterval(() => {
      const now = performance.now(), dt = (now - rp.last) / 1000;
      rp.last = now;
      let target = rp.pos + dt * rp.speed;
      const next = rp.events[rp.idx];
      // Long quiet stretches are skipped: jump to a second before the next event.
      if (rp.skip && next && (next.ts - rp.pos) / rp.speed > 3) target = Math.max(target, next.ts - rp.speed);
      seek(target, true);
      if (rp.pos >= rp.t1) play(false);
    }, 100);
  }
  updateReplayBar();
}
function buildReplayBar() {
  const rp = S.rp, bar = $('replaybar');
  const playBtn = el('button', { class: 'btn primary', type: 'button', id: 'rp-play', onclick: () => play(!rp.playing) }, 'Play');
  const speeds = el('div', { class: 'seg' });
  for (const s of [1, 10, 60, 120]) {
    const b = el('button', { type: 'button', onclick: () => { rp.speed = s; updateReplayBar(); } }, s + '×');
    b.dataset.s = String(s);
    speeds.append(b);
  }
  const slider = el('input', { type: 'range', id: 'rp-range', min: String(rp.t0), max: String(Math.max(rp.t1, rp.t0 + 1)), step: 'any', 'aria-label': 'Timeline',
    oninput: (ev) => seek(Number(ev.target.value), false) });
  bar.replaceChildren(
    el('span', { class: 'title' }, 'Replay of run ', el('span', { class: 'mono' }, S.run)),
    playBtn, speeds,
    el('button', { class: 'btn', type: 'button', title: 'Jump to the next event', onclick: () => { const n = rp.events[rp.idx]; if (n) seek(n.ts, true); } }, 'Next event ⏭'),
    slider,
    el('span', { class: 'mono small', id: 'rp-time' }),
    el('label', { class: 'small muted', style: 'display:flex;gap:4px;align-items:center' }, el('input', { type: 'checkbox', checked: rp.skip, onchange: (ev) => { rp.skip = ev.target.checked; } }), 'skip quiet stretches'),
    el('button', { class: 'btn small', type: 'button', title: 'The config and skills this run started with', onclick: () => openRunConfig(S.run) }, 'Config'),
    el('button', { class: 'btn ghost close', type: 'button', title: 'Close the replay', 'aria-label': 'Close the replay', onclick: backToLive }, '✕'));
  bar.classList.remove('hidden');
  updateReplayBar();
}
function updateReplayBar() {
  const rp = S.rp;
  if (!rp) return;
  const b = $('rp-play');
  if (!b) return;
  b.textContent = rp.playing ? 'Pause' : 'Play';
  for (const x of b.parentElement.querySelectorAll('.seg button')) x.classList.toggle('on', x.dataset.s === String(rp.speed));
  const r = $('rp-range');
  if (document.activeElement !== r) r.value = String(rp.pos);
  $('rp-time').textContent = fmtDate(rp.pos) + ':' + pad2(new Date(rp.pos * 1000).getSeconds()) + ' · ' + fmtDur(rp.pos - rp.t0) + ' of ' + fmtDur(rp.t1 - rp.t0) + ' · ' + rp.idx + '/' + rp.events.length + ' events';
}
document.addEventListener('keydown', (ev) => {
  if (S.mode !== 'replay' || !S.rp || ev.target.closest('input,textarea,select,.slides')) return;
  if (ev.key === ' ') { ev.preventDefault(); play(!S.rp.playing); }
});

// ───────────────────────────── start ─────────────────────────────

async function start() {
  buildHeader();
  mountAll();
  await loadFirms();
  const h = readHash();
  S.tab = TABS.some(([t]) => t === h.tab) ? h.tab : 'kickoff';
  S.firm = (h.firm && S.firms.some((f) => f.name === h.firm) && h.firm) || (S.firms[0] && S.firms[0].name) || null;
  showTab(S.tab);
  if (!S.firm) {
    $('tab-overview').replaceChildren(el('div', { class: 'empty card' }, 'No firms are configured. Add one under `firms:` in the config; see docs/office.md.'));
    renderHeader();
    return;
  }
  if (h.replay) enterReplay(h.replay);
  else await loadFirm();
  setInterval(() => {
    if (document.hidden) return;
    if (live()) loadFirm();
    if (S.tab === 'security') pollSecurity();
    scheduleRender();
  }, 5000);
  setInterval(() => { if (!document.hidden) loadFirms().then(renderHeader); }, 30000);
  // The scenario's countdown ticks every second (in place; see scenarioButton).
  setInterval(() => { if (!document.hidden && SCN.whenEl && live()) renderHeader(); }, 1000);
}
start();
</script>
</body>
