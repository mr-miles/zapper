[package]
name = "zapper-warden"
description = "zapperclaw's host side: worker sandboxes from fixed templates, for an office that runs in a sandbox of its own"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
rand = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zapper-driver = { path = "../zapper-driver" }
zapper-openshell = { path = "../zapper-openshell" }
zapper-policy = { path = "../zapper-policy" }
zapper-util = { path = "../zapper-util" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[[bin]]
name = "zapper-warden"
path = "src/main.rs"
