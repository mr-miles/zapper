<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>zapper terminal</title>
<link rel="stylesheet" href="/assets/xterm.css">
<script src="/assets/xterm.js"></script>
<style>
  html, body { margin:0; height:100%; background:#000; color:#d7dae0; font: 12px/1.4 ui-sans-serif, system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:6px 10px; background:#171a21; border-bottom:1px solid #262b36; }
  header .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  header .state { margin-left:auto; color:#8b93a3; }
  #term { padding:8px; }
</style>
</head>
<body>
<header><b id="title"></b><span class="mono" id="cmd"></span><span class="state" id="state">connecting…</span></header>
<div id="term"></div>
<script>
// Read-only: the terminal's kept output, then its live output. Keystrokes
// here go nowhere. Data from the session is written through xterm.js and
// textContent only.
const q = new URLSearchParams(location.search);
const session = q.get('session'), n = q.get('n');
// Framed in the session's page, whose buttons already say which terminal.
if (q.has('embed')) document.querySelector('header').style.display = 'none';
const $ = (id) => document.getElementById(id);
$('title').textContent = 'session ' + session + ' · terminal ' + n;
document.title = 'zapper ' + session + ' · terminal ' + n;

async function start() {
  if (typeof Terminal === 'undefined') { $('state').textContent = 'the terminal viewer (xterm.js) did not load'; return; }
  const list = await fetch('/api/sessions/' + encodeURIComponent(session) + '/terminals').then(r => r.ok ? r.json() : []);
  const info = list.find(t => String(t.id) === n);
  if (!info) { $('state').textContent = 'no such terminal'; return; }
  $('cmd').textContent = info.argv.join(' ');
  const term = new Terminal({ disableStdin: true, convertEol: true, cursorBlink: false, rows: info.rows, cols: info.cols, fontSize: 13, scrollback: 5000,
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace' });
  term.open($('term'));
  const source = new EventSource('/api/sessions/' + encodeURIComponent(session) + '/terminals/' + encodeURIComponent(n) + '/stream');
  // Each (re)connection replays the history, so start from a clean screen.
  source.onopen = () => { term.reset(); $('state').textContent = 'read-only · live'; };
  source.onmessage = (m) => {
    const c = JSON.parse(m.data);
    if (c.o !== undefined) term.write(Uint8Array.from(atob(c.o), ch => ch.charCodeAt(0)));
    else if (c.r) term.resize(c.r[1], c.r[0]);
    else if ('end' in c) {
      $('state').textContent = 'closed' + (c.end === null ? '' : ', exit ' + c.end);
      source.close();
    }
  };
  source.onerror = () => { if (source.readyState !== EventSource.CLOSED) $('state').textContent = 'reconnecting…'; };
}
start();
</script>
</body>
</html>
