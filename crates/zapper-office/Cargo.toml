[package]
name = "zapper-office"
description = "The Office: firms of AI workers in OpenShell sandboxes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
zapper-git = { path = "../zapper-git" }
zapper-util = { path = "../zapper-util" }
zapper-driver = { path = "../zapper-driver" }
zapper-record = { path = "../zapper-record" }
zapper-mint = { path = "../zapper-mint" }
zapper-runs = { path = "../zapper-runs" }
zapper-policy = { path = "../zapper-policy" }
zapper-github = { path = "../zapper-github" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
rand = "0.8"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ring = "0.17"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
# The OpenShell gateway the office runs its firms on (docs/openshell-migration.md).
# Its proto build uses a vendored protoc, so no system one is needed.
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.7" }
zapper-openshell = { path = "../zapper-openshell" }

[[bin]]
name = "zapper-office"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
