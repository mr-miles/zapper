<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>zapper office</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/mount/office.css">
</head>
<body>
<header>
  <div class="replaybar hidden" id="replaybar"></div>
  <div class="hrow">
    <div class="brand">
      <!-- The firm's logo, as on the product's landing page (office/facility.rs). -->
      <svg class="spark-logo" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#D97757" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><circle cx="32" cy="32" r="29"/><path d="M42.16 36.21L36.21 42.16L27.79 42.16L21.84 36.21L21.84 27.79L27.79 21.84L36.21 21.84L42.16 27.79Z"/><path d="M42.16 36.21L42.16 60.23M36.21 42.16L19.23 59.15M27.79 42.16L3.77 42.16M21.84 36.21L4.85 19.23M21.84 27.79L21.84 3.77M27.79 21.84L44.77 4.85M36.21 21.84L60.23 21.84M42.16 27.79L59.15 44.77"/></g></svg>
      <span id="firmpick"></span>
      <h1 id="firmname">office</h1>
      <span class="desc" id="firmdesc"></span>
    </div>
    <div class="hstats" id="hstats"></div>
    <div class="hlinks" id="hlinks"></div>
  </div>
  <div class="hscen hidden" id="hscen"></div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main>
  <section class="tab" id="tab-kickoff"></section>
  <section class="tab" id="tab-overview"></section>
  <section class="tab" id="tab-people"></section>
  <section class="tab" id="tab-work"></section>
  <section class="tab" id="tab-plans"></section>
  <section class="tab" id="tab-messages"></section>
  <section class="tab" id="tab-security"></section>
  <section class="tab" id="tab-drive"></section>
  <section class="tab" id="tab-git"></section>
  <!-- Every firm tab while no company runs: one page, as the Git tab had. -->
  <section class="tab" id="tab-off"></section>
  <section class="tab" id="tab-stats"></section>
  <section class="tab" id="tab-vms"></section>
  <section class="tab" id="tab-runs"></section>
</main>
<footer class="foot" id="foot" aria-label="Run at a glance"></footer>
<div class="cfg hidden" id="cfg" role="dialog" aria-label="A run's config"></div>
<aside class="panel" id="panel" aria-label="Worker"></aside>
<div class="toast hidden" id="toast" role="status"></div>
<script src="/mount/common.js"></script>
<script src="/mount/model.js"></script>
<script src="/mount/org.js"></script>
<script src="/mount/compose.js"></script>
<script src="/mount/transcripts.js"></script>
<script src="/mount/markdown.js"></script>
<script src="/mount/messages.js"></script>
<script src="/mount/security.js"></script>
<script src="/mount/vms.js"></script>
<script src="/mount/drive.js"></script>
<script src="/mount/git.js"></script>
<script src="/mount/kickoff.js"></script>
<script src="/mount/runs.js"></script>
<script src="/mount/work.js"></script>
<script src="/mount/plans.js"></script>
<script src="/mount/stats.js"></script>
<script src="/mount/header.js"></script>
<script src="/mount/main.js"></script>
</body>
</html>
