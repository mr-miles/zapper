<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench</title>
<style>
  :root { --bg: #fafafa; --fg: #1d1d1f; --muted: #6e6e73; --line: #e2e2e6; --card: #fff; --accent: #2457c5; --deny: #b3261e; --allow: #1e7a3c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #ececf0; --muted: #9a9aa2; --line: #2c2c31; --card: #1e1e21; --accent: #7ea2ff; --deny: #ff8a80; --allow: #6fd28f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header .who { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  ul.list li:hover, ul.list li.on { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.allow { color: var(--allow); } button.deny { color: var(--deny); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  .events { max-height: 340px; overflow: auto; border-top: 1px solid var(--line); margin-top: 8px; }
  .events div { padding: 2px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  .deny-v { color: var(--deny); } .allow-v { color: var(--allow); }
  pre.term { background: #000; color: #ddd; padding: 8px; max-height: 300px; overflow: auto; white-space: pre-wrap; }
  form.new { display: grid; gap: 6px; margin-top: 8px; }
  select, input[type=text] { font: inherit; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
  .err { color: var(--deny); }
</style>
</head>
<body>
<header><h1>Workbench</h1><span class="who" id="who"></span></header>
<main>
  <div>
    <section>
      <h2>Sessions</h2>
      <ul class="list" id="sessions"></ul>
      <form class="new" id="new" hidden>
        <h2>New session</h2>
        <select id="profile"></select>
        <label><input type="checkbox" id="persistent"> keep its disks (persistent)</label>
        <label><input type="checkbox" id="ssh"> SSH on</label>
        <button type="submit">Create</button>
        <span class="err" id="newerr"></span>
      </form>
    </section>
    <section style="margin-top:16px">
      <h2>Approvals</h2>
      <div id="approvals" class="muted">None waiting.</div>
    </section>
    <div id="panels"></div>
  </div>
  <section id="detail"><span class="muted">Pick a session.</span></section>
</main>
<script>
"use strict";
const H = { "X-Workbench-UI": "1", "Content-Type": "application/json" };
let me = null, picked = null, feed = null, term = null;

function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
async function api(method, path, body) {
  const r = await fetch("/w/v1" + path, { method, headers: H, body: body === undefined ? undefined : JSON.stringify(body) });
  const v = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(v.error || r.statusText);
  return v;
}
const may = r => me && me.token.rights.includes(r);

async function loadSessions() {
  const list = document.getElementById("sessions");
  const ss = await api("GET", "/sessions");
  list.replaceChildren();
  if (!ss.length) list.append(el("li", "None yet.", "muted"));
  for (const s of ss) {
    const li = el("li");
    li.append(el("span", s.id + " · " + s.profile, "mono"), el("span", s.state + (s.ssh ? " · ssh" : ""), "muted"));
    if (s.id === picked) li.classList.add("on");
    li.onclick = () => pick(s.id);
    list.append(li);
  }
}

async function loadApprovals() {
  const box = document.getElementById("approvals");
  const as = await api("GET", "/approvals");
  box.replaceChildren();
  if (!as.length) { box.textContent = "None waiting."; box.className = "muted"; return; }
  box.className = "";
  for (const a of as) {
    const row = el("div", null, "row");
    row.append(el("span", a.session + ": " + a.subject, "mono"));
    if (may("answer")) {
      for (const [label, allow, remember] of [["Allow", true, null], ["Allow for the session", true, "session"], ["Deny", false, null]]) {
        const b = el("button", label, allow ? "allow" : "deny");
        b.onclick = async () => { try { await api("POST", "/approvals/" + encodeURIComponent(a.id), { allow, remember }); } catch (e) { alert(e.message); } loadApprovals(); };
        row.append(b);
      }
    }
    box.append(row);
  }
}

async function pick(id) {
  picked = id;
  if (feed) feed.close();
  if (term) term.close();
  loadSessions();
  const d = document.getElementById("detail");
  d.replaceChildren();
  let s;
  try { s = await api("GET", "/sessions/" + id); } catch (e) { d.append(el("span", e.message, "err")); return; }
  d.append(el("h2", "Session " + s.id));
  const facts = el("div", null, "mono");
  facts.textContent = [s.profile, s.state, s.image, s.persistent ? "persistent" : "", s.ssh ? "ssh on" : "",
    Object.entries(s.labels || {}).map(([k, v]) => k + "=" + v).join(" ")].filter(Boolean).join(" · ");
  d.append(facts);
  if (may("control")) {
    const row = el("div", null, "row");
    for (const [label, method, path] of [["Stop", "POST", "/stop"], ["Start", "POST", "/start"], ["Remove", "DELETE", ""]]) {
      const b = el("button", label);
      b.onclick = async () => { b.disabled = true; try { await api(method, "/sessions/" + id + path, method === "POST" ? {} : undefined); } catch (e) { alert(e.message); } b.disabled = false; label === "Remove" ? (picked = null, document.getElementById("detail").replaceChildren(), loadSessions()) : pick(id); };
      row.append(b);
    }
    d.append(row);
  }
  // Terminals, read-only: their output as text.
  try {
    const ts = await api("GET", "/sessions/" + id + "/terminals");
    if (ts.length) {
      d.append(el("h2", "Terminals"));
      const row = el("div", null, "row");
      const out = el("pre", "", "term mono");
      for (const t of ts) {
        const b = el("button", t.id + ": " + (t.argv || []).join(" ") + (t.open ? "" : " (ended)"));
        b.onclick = () => watch(id, t.id, out);
        row.append(b);
      }
      d.append(row, out);
    }
  } catch (e) {}
  d.append(el("h2", "Events"));
  const ev = el("div", null, "events mono");
  d.append(ev);
  feed = new EventSource("/w/v1/events?history=true&session=" + encodeURIComponent(id));
  feed.onmessage = m => {
    let e; try { e = JSON.parse(m.data); } catch { return; }
    const line = el("div", new Date((e.ts || 0) * 1000).toLocaleTimeString() + "  " + (e.type || "") + "  " + (e.summary || ""));
    if (e.verdict === "deny") line.className = "deny-v";
    if (e.verdict === "allow") line.className = "allow-v";
    ev.append(line);
    ev.scrollTop = ev.scrollHeight;
    if (e.type === "ask" || e.type === "answer") loadApprovals();
    if (e.type === "session") loadSessions();
  };
}

// ANSI escapes out, so the output reads as text.
const strip = s => s.replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]|\x1b\][^\x07]*(\x07|\x1b\\)|\x1b[@-_]/g, "");
function watch(id, n, out) {
  if (term) term.close();
  out.textContent = "";
  term = new EventSource("/w/v1/sessions/" + id + "/terminals/" + n);
  const dec = new TextDecoder();
  term.onmessage = m => {
    let c; try { c = JSON.parse(m.data); } catch { return; }
    if (c.o) {
      const bytes = Uint8Array.from(atob(c.o), ch => ch.charCodeAt(0));
      out.textContent = (out.textContent + strip(dec.decode(bytes, { stream: true }))).slice(-100000);
      out.scrollTop = out.scrollHeight;
    }
    if ("end" in c) { out.textContent += "\n[ended " + c.end + "]"; term.close(); }
  };
}

async function loadPanels() {
  const fs = await api("GET", "/facilities");
  const box = document.getElementById("panels");
  for (const f of fs) {
    if (!f.panel) continue;
    const sec = el("section"); sec.style.marginTop = "16px";
    sec.append(el("h2", f.title || f.name));
    // The facility's script fills it, building its elements as this page does.
    const body = el("div");
    body.dataset.facility = f.name;
    sec.append(body);
    box.append(sec);
    const s = document.createElement("script");
    s.src = f.panel;
    sec.append(s);
  }
}

async function start() {
  try { me = await api("GET", "/status"); } catch (e) { document.getElementById("detail").replaceChildren(el("span", e.message, "err")); return; }
  const labels = Object.entries(me.token.labels).map(([k, v]) => k + "=" + v).join(" ");
  document.getElementById("who").textContent = "token " + me.token.name + (labels ? " · sessions with " + labels : "") + " · zapper " + me.zapper.version;
  if (may("create")) {
    const form = document.getElementById("new");
    form.hidden = false;
    const sel = document.getElementById("profile");
    for (const p of await api("GET", "/profiles")) sel.append(el("option", p));
    form.onsubmit = async e => {
      e.preventDefault();
      const err = document.getElementById("newerr");
      err.textContent = "Starting…";
      try {
        const s = await api("POST", "/sessions", { profile: sel.value, persistent: document.getElementById("persistent").checked, ssh: document.getElementById("ssh").checked });
        err.textContent = "";
        pick(s.id);
      } catch (x) { err.textContent = x.message; }
    };
  }
  await Promise.all([loadSessions(), loadApprovals(), loadPanels()]);
  setInterval(() => { loadSessions(); loadApprovals(); }, 10000);
}
start();
</script>
</body>
</html>
