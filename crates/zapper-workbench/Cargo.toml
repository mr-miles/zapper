[package]
name = "zapper-workbench"
description = "A layer for single users on zapper: a gateway with tokens over zapper's API, its facilities and their UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
zapper-ssh = { path = "../zapper-ssh" }
zapper-proto = { path = "../zapper-proto" }
zapper-git = { path = "../zapper-git" }
ring = "0.17"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
russh = { version = "0.65", default-features = false, features = ["ring"] }
zapper-core = { path = "../zapper-core", default-features = false, features = ["test-util"] }
zapper-api = { path = "../zapper-api" }
