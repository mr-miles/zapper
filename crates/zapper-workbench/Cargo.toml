[package]
name = "zapper-workbench"
description = "One person's drive, repository and sandbox templates for OpenShell sandboxes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
libc = "0.2"
ring = "0.17"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zapper-driver = { path = "../zapper-driver" }
zapper-git = { path = "../zapper-git" }
zapper-openshell = { path = "../zapper-openshell" }
zapper-policy = { path = "../zapper-policy" }
zapper-util = { path = "../zapper-util" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
