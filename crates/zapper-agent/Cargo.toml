[package]
name = "zapper-agent"
description = "Guest side of zapper: prepares the sandbox and supervises exec"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["office"]
# Firm workers' `office` command and MCP server, and the fake Claude and pi
# the office's tests use.
office = []

[dependencies]
zapper-policy = { path = "../zapper-policy" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
globset.workspace = true
libc = "0.2"
ureq = { version = "2", default-features = false }
