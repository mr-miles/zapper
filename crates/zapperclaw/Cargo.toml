[package]
name = "zapperclaw"
description = "The office cut down to a post office, a foreman per worker and a drive, run in an OpenShell sandbox of its own behind the warden"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zapper-driver = { path = "../zapper-driver" }
zapper-openshell = { path = "../zapper-openshell" }
zapper-policy = { path = "../zapper-policy" }
zapper-record = { path = "../zapper-record" }
zapper-util = { path = "../zapper-util" }
zapper-workbench = { path = "../zapper-workbench" }
# The post office's store (office.db). 0.39: on the libsqlite3-sys the
# OpenShell SDK's sqlx already builds, bundled, so one SQLite is linked.
rusqlite = { version = "0.39", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[[bin]]
name = "zapperclaw"
path = "src/main.rs"
