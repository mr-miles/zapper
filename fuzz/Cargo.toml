[package]
name = "zapper-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zapper-core = { path = "../crates/zapper-core", features = ["fuzz"] }

# Not part of the main workspace: cargo-fuzz builds it with nightly.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "dns_query"
path = "fuzz_targets/dns_query.rs"
test = false
doc = false
bench = false

