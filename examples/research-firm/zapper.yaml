# A firm that researches: Ada, the CEO, gets a question from the board and
# hires a research manager, who scopes it with web search, writes a
# research plan naming the sources and the sites they're on, and hires
# researchers to work through it. Once the board has the findings and asks
# for a prototype, Ada commissions a prototype engineer to build it in the
# firm's repository. Each researcher asks for the plan's sites,
# writes a pack of Markdown documents with references and suggests sources
# the plan missed; the research manager decides on those, collates the packs
# into one, reviews it and reports to Ada, who reports to you. Everyone is
# Claude Code in a VM of their own. See README.md beside this file.
#
# A complete config, to run instead of config/zapper.yaml:
#   zapper --config examples/research-firm/zapper.yaml serve
# Relative paths resolve against this file's directory. Downloads, images,
# state and the Claude token are the main config's, under your home.

daemon:
  # Where firms' runs are kept (their mail, transcripts, journals).
  state: ~/.local/state/zapper
  # The most sandboxes at once (openshell.yaml's max_sessions overrides it).
  max_sessions: 16

# The Claude token is the gateway's `anthropic` provider, which opens
# api.anthropic.com for the sandboxes (docs/quickstart.md).

policy:
  defaults: { net: deny, exec: allow }

profiles:
  # Claude Code (image: make image IMAGE=office). The Claude API is allowed
  # with the token the host adds, and Claude Code's web search runs there,
  # so searching needs no access. Fetching a page is asked about: in this
  # firm Ada holds security and decides, against the research plan.
  claude:
    engine:
      image: office
      kernel: vmlinux-6.1
      vcpus: 2
      memory_mib: 4096
      disk: 8GiB
      network: nic
    agent:
      kind: claude-code
      command: [claude]
      user: agent
      workdir: /work
      env:
        CLAUDE_CODE_OAUTH_TOKEN: "{{secret:claude}}"
        # The image's headless browser, for `browse`.
        PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
    mounts:
      - { host: "{workdir}", guest: /work, mode: rw }
    policy:
      net:
        - { action: allow, host: api.anthropic.com, ports: [443] }
        # The firm's repository comes with a grant (credentials_request),
        # which allows it in the worker's own layer; never a network ask.
        - { action: deny, host: git.lab.internal, comment: with a git grant only }
      defaults: { net: ask }
