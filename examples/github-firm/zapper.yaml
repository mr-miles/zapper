# A company that builds software on GitHub: Ada, the CEO, starts alone,
# hires a product manager to write the specification of a shopping list app,
# then engineers to build it in a repository of yours on GitHub. They work
# only with the firm's own git server; the daemon keeps it in step with
# GitHub through your GitHub App, publishes their branches as pull requests,
# and mails them their checks and reviews. You, the board, merge on GitHub.
# See README.md beside this file.
#
# A complete config, to run instead of config/zapper.yaml:
#   zapper --config examples/github-firm/zapper.yaml serve
# Relative paths resolve against this file's directory. Downloads, images,
# state and the Claude token are the main config's, under your home.

daemon:
  # Where firms' runs are kept (their mail, transcripts, journals).
  state: ~/.local/state/zapper
  # The most sandboxes at once (openshell.yaml's max_sessions overrides it).
  max_sessions: 16

# The Claude token is the gateway's `anthropic` provider, which opens
# api.anthropic.com for the sandboxes (docs/quickstart.md).

policy:
  defaults: { net: deny, exec: allow }

profiles:
  # Claude Code (image: make image IMAGE=office, which has Node.js, git, gh
  # and a headless Chromium). The Claude API is allowed with the token the
  # host adds; any other host is asked about, and in a firm the CEO (who
  # holds security here) or the board decides.
  claude:
    engine:
      image: office
      kernel: vmlinux-6.1
      vcpus: 2
      memory_mib: 4096
      disk: 16GiB
      network: nic
    agent:
      kind: claude-code
      command: [claude]
      user: agent
      workdir: /work
      env:
        CLAUDE_CODE_OAUTH_TOKEN: "{{secret:claude}}"
        PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
        NODE_PATH: /usr/local/lib/node_modules
    mounts:
      - { host: "{workdir}", guest: /work, mode: rw }
    policy:
      net:
        - { action: allow, host: api.anthropic.com, ports: [443] }
        # The firm's repositories come with a grant (credentials_request),
        # which allows them in the worker's own layer; never a network ask.
        - { action: deny, host: git.octo.internal, comment: with a git grant only }
      defaults: { net: ask }

  # Engineers also install packages from npm.
  claude-engineer:
    extends: claude
    policy:
      net:
        - { action: allow, host: registry.npmjs.org, ports: [443], comment: npm packages }
