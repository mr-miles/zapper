# The smallest company that shows its people at work: Ada, the CEO, alone
# at first, contracts Ben, a writer; both Claude Code, each in a VM of their
# own. No git repository, no cluster: only mail, a budget and the shared
# drive. The board (you) gives Ada a task and approves her budget; she
# contracts Ben, agrees his quote, reviews his draft, publishes the result
# and reports back. See README.md beside this file.
#
# A complete config, to run instead of config/zapper.yaml:
#   zapper --config examples/mini-firm/zapper.yaml serve
# Relative paths resolve against this file's directory. Downloads, images,
# state and the Claude token are the main config's, under your home.

daemon:
  firecracker: ~/.local/share/zapper/bin/firecracker
  images: ~/.local/share/zapper/images
  kernels: ~/.local/share/zapper/kernels
  state: ~/.local/state/zapper
  ui: 127.0.0.1:7878
  ask_timeout_secs: 60
  max_sessions: 16

# Your Claude subscription's token, as config/zapper.yaml sets it up: from
# `claude setup-token`, in a 0600 file. The VMs never see it.
secrets:
  claude:
    file: ~/.config/zapper/claude-token
    hosts: [api.anthropic.com]

policy:
  defaults: { net: deny, exec: allow }

profiles:
  # Claude Code, the one profile the firm needs (image: make image
  # IMAGE=office). The Claude API is allowed with the token the host adds;
  # any other host is asked about, and in a firm the CEO (who holds
  # security here) or the board decides.
  claude:
    engine:
      image: office
      kernel: vmlinux-6.1
      vcpus: 2
      memory_mib: 4096
      disk: 8GiB
      network: nic
    agent:
      kind: claude-code
      command: [claude]
      user: agent
      workdir: /work
      env:
        CLAUDE_CODE_OAUTH_TOKEN: "{{secret:claude}}"
    mounts:
      - { host: "{workdir}", guest: /work, mode: rw }
    policy:
      net:
        - { action: allow, host: api.anthropic.com, ports: [443], secrets: [claude] }
      defaults: { net: ask }

firms:
  mini:
    description: A CEO who contracts a writer
    # The repository's skills: the playbooks any role may use.
    skills_dir: ../../config/skills
    # The repository's agent definitions: each role's brief and own skills.
    agents_dir: ../../config/agents
    # A run budget, in tokens: contracting needs one. The seed is what Ada
    # has before the board approves her request; a quote's 30k fee comes
    # out of it.
    budget: { seed: 1000000 }
    # The name of the first hire whose hirer doesn't pick one: the writer.
    names: [ben]
    roles:
      ceo:
        profile: claude
        title: CEO
        model: claude-sonnet-5-5
        agent: ceo
        # Ada may hire or contract writers (and gets the manager skill).
        # No officer role here: with one, she would have to hire a security
        # officer before anyone else.
        hires: [writer]
      writer:
        profile: claude
        title: Writer
        model: claude-sonnet-5-5
        agent: researcher
    # The founder; Ben joins as a contractor during the run.
    workers:
      - { name: ada, role: ceo }
