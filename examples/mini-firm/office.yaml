# The Office's firms for the mini-firm example (zapper-office's own config).
# Loaded by the office, beside this example's zapper.yaml.
firms:
  mini:
    description: A CEO who contracts a writer
    # The repository's skills: the playbooks any role may use.
    skills_dir: ../../config/skills
    # The repository's agent definitions: each role's brief and own skills.
    agents_dir: ../../config/agents
    # A run budget, in tokens: contracting needs one. The seed is what Ada
    # has before the board approves her request; a quote's 30k fee comes
    # out of it.
    budget: { seed: 1000000 }
    # The name of the first hire whose hirer doesn't pick one: the writer.
    names: [ben]
    roles:
      ceo:
        profile: claude
        title: CEO
        model: claude-sonnet-5-5
        agent: ceo
        # Ada may hire or contract writers (and gets the manager skill).
        # No officer role here: with one, she would have to hire a security
        # officer before anyone else.
        hires: [writer]
      writer:
        profile: claude
        title: Writer
        model: claude-sonnet-5-5
        agent: researcher
    # The founder; Ben joins as a contractor during the run.
    workers:
      - { name: ada, role: ceo }
