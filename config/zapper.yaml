# The profiles and image recipes The Office runs its workers from. In a
# checkout, `zapper-office` uses this file when run from the repository's
# root; elsewhere `zapper-office init` copies it to ~/.config/zapper/zapper.yaml
# once and never overwrites it. Relative paths here resolve against this
# file's directory; `~/` is your home. The office reads it again when it
# changes.
#
# Each worker is a sandbox of an OpenShell gateway (openshell.yaml), made from
# its profile: its image, CPU, memory and disk, its agent's settings and
# files, and its network rules. Rules are layered: a worker's own → its role's
# → its profile → the profiles it extends → global; the allows among them
# become the sandbox's policy, and what no rule allows OpenShell refuses and
# drafts a rule for, which the firm's security officers decide. What OpenShell
# can't do (exec and fs rules, the daemon's settings, rules that name
# secrets) is ignored, and `zapper-office serve` lists it when it starts.

daemon:
  # Where firms' runs are kept (their mail, transcripts, journals).
  state: ~/.local/state/zapper
  # The most sandboxes at once (openshell.yaml's max_sessions overrides it).
  max_sessions: 16

# Credentials are the OpenShell gateway's providers, never this file's: the
# Claude token is the `anthropic` provider (`openshell provider create --type
# anthropic ...`, docs/quickstart.md), which opens api.anthropic.com for its
# sandboxes and adds the token outside the VM. A rule here that names a secret
# is left out, and the office says so when it starts.

policy:
  defaults: { net: deny, exec: allow }
  net:
    - {
        action: deny,
        host: "metadata.google.internal",
        final: true,
        comment: cloud metadata,
      }
  exec: []

profiles:
  # Everything inherits from here.
  base:
    description: Ubuntu shell; network only as rules allow
    engine:
      image: ubuntu-26.04
      kernel: vmlinux-6.1
      vcpus: 2
      memory_mib: 2048
      disk: 4GiB
      network: nic # or vsock: no NIC, proxy-aware programs only
    agent:
      kind: generic
      command: [bash, -l]
      user: user
      workdir: /work

  # `zapper run`: a shell on a copy of the current directory.
  default:
    extends: base
    description: Shell on a copy of the current directory
    mounts:
      - { host: "{workdir}", guest: /work, mode: rw }

  # `zapper run -p claude`: Claude Code on a copy of the current directory.
  # The Claude API is allowed with the token the host adds; every other
  # host waits for an answer (the UI, or zapper approve). Image: make image
  # IMAGE=office.
  claude:
    extends: default
    description: Claude Code on a copy of the current directory
    engine: { image: office, memory_mib: 4096, disk: 8GiB }
    agent:
      kind: claude-code
      command: [claude]
      user: agent
      env:
        CLAUDE_CODE_OAUTH_TOKEN: "{{secret:claude}}"
    policy:
      net:
        - { action: allow, host: api.anthropic.com, ports: [443] }
      defaults: { net: ask }

  # A firm's cluster (`facilities: { cluster: { kind: k3s, profile: k3s } }`):
  # a sandbox of its own in which the office runs a single-node k3s, rootless
  # as the sandbox's user (OpenShell runs nothing as root), and reaches its
  # API and ingress over the gateway. Workers reach it through the office
  # edge (`/cluster`, `/apps`). Its log is ~/k3s.log. Image pulls are
  # allowed. Image: make image IMAGE=k3s.
  k3s:
    extends: default
    description: A test Kubernetes cluster (k3s) on a copy of the current directory
    engine:
      {
        image: k3s,
        vcpus: 4,
        memory_mib: 8192,
        disk: 30GiB,
      }
    agent:
      kind: generic
      command: [bash, -l]
      env: { KUBECONFIG: /home/agent/.kube/k3s.yaml }
    policy:
      net:
        - { action: allow, host: registry-1.docker.io, ports: [443], comment: image pulls }
        - { action: allow, host: auth.docker.io, ports: [443] }
        - { action: allow, host: production.cloudflare.docker.com, ports: [443] }
        - { action: allow, host: production.cloudfront.docker.com, ports: [443] }
        - { action: allow, host: ghcr.io, ports: [443] }
        - { action: allow, host: pkg-containerd.githubusercontent.com, ports: [443] }
        - { action: allow, host: quay.io, ports: [443] }
        - { action: allow, host: "*.quay.io", ports: [443] }
      defaults: { net: ask }

  # zapperclaw (docs/zapperclaw.md, docs/warden.md): the office sandbox the
  # warden makes and runs zapperclaw in, and fake workers for the end-to-end
  # tests (tests/e2e-warden.sh, tests/e2e-zapperclaw.sh). Images: make image
  # IMAGE=zapperclaw-office, make image IMAGE=office-fake.
  zapperclaw-office:
    extends: base
    description: The zapperclaw office sandbox (zapperclaw, and curl, socat and jq for the warden's probe)
    engine: { image: zapperclaw-office, vcpus: 1, memory_mib: 1024, disk: 2GiB }
    agent:
      kind: generic
      command: [bash, -l]
      user: agent
      workdir: /home/agent

  zapperclaw-fake:
    extends: base
    description: A fake Claude Code playing no script, for the warden's end-to-end test
    engine: { image: office-fake }
    agent:
      kind: claude-code
      command: [claude]
      user: agent
      workdir: /home/agent
      env: { ZAPPER_FAKE_SCRIPT: /fake/none.yaml }

  zapperclaw-echo:
    extends: zapperclaw-fake
    description: A fake Claude Code that answers the board's mail, for zapperclaw's end-to-end test
    agent:
      env: { ZAPPER_FAKE_SCRIPT: /fake/zc-echo.yaml }

  # MCP servers behind the gateway (http://mcp.zapper.internal/mcp in each
  # session), once the fork has feat/mcp-gateway. A profile lists the servers
  # its sessions may use, and knows no others:
  #
  #   claude:
  #     mcp: [github]
  #
  # Headers may use secrets bound to the server's host; `github` here would be
  # a secret with `hosts: [api.githubcopilot.com]`.
  #
  # mcp:
  #   servers:
  #     github:
  #       url: https://api.githubcopilot.com/mcp/
  #       headers: { Authorization: "Bearer {{secret:github}}" }
  #     files:
  #       command: [npx, -y, "@modelcontextprotocol/server-filesystem", /srv/shared]

# Image recipes: `zapper image build NAME` (or `make image IMAGE=NAME`)
# builds one into daemon.images, from an OCI base and the steps here. A
# recipe's `args` are files or directories from the host (`--arg NAME=PATH`,
# else the default), which its `copy` puts in the image after `run`. To update a
# pinned version, change it here and rebuild the image.
images:
  ubuntu-26.04:
    description: The base image, for the plain profiles
    from: docker.io/library/ubuntu:26.04
    run:
      - "apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git less procps iproute2 && rm -rf /var/lib/apt/lists/*"

  # Office workers: Claude Code at a pinned version (auto-update is off in
  # sessions), pi, a headless browser for checking what they build
  # (Playwright and its Chromium; the `browse` command wraps it), and the
  # tools engineers deploy with. Node.js LTS from nodejs.org, as Ubuntu's is
  # too old for Playwright.
  office:
    description: Claude Code and pi (pinned), git, kubectl, podman, Node.js, Python, a headless browser
    from: docker.io/library/ubuntu:26.04
    run:
      - "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git less procps ripgrep jq make xz-utils python3 python3-pip python3-venv podman buildah fuse-overlayfs uidmap && rm -rf /var/lib/apt/lists/*"
      - "curl -fsSL -o /tmp/node.tar.xz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz && echo 'df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/node.tar.xz' | sha256sum -c && tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1 --exclude='*.md' --exclude=LICENSE && rm /tmp/node.tar.xz && node --version"
      - "curl -fsSL -o /usr/local/bin/kubectl https://dl.k8s.io/release/v1.36.5/bin/linux/amd64/kubectl && echo '33bc88a24c3b09cf55bfd59e6ca977881b61fc3f25ab65bc80c65b430248648e  /usr/local/bin/kubectl' | sha256sum -c && chmod 755 /usr/local/bin/kubectl"
      - "curl -fsSL https://claude.ai/install.sh | bash -s 2.1.301 && cp -L /root/.local/bin/claude /usr/local/bin/claude && rm -rf /root/.local /root/.claude* && claude --version"
      - "npm install -g --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.3.0 && PI_OFFLINE=1 pi --version && rm -rf /root/.npm /root/.pi"
      - "npm install -g --no-audit --no-fund playwright@1.64.1 && PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright playwright install --with-deps chromium && chmod -R a+rX /opt/ms-playwright && rm -rf /var/lib/apt/lists/* /root/.npm"

  # The office's end-to-end tests: the office image's place, with a fake
  # Claude Code and pi that play scripts (ZAPPER_FAKE_SCRIPT, set by the
  # profile, names one of those under /fake) instead of thinking, so firms'
  # runs are the same every time and cost no tokens. A profile on this image
  # drives them exactly as it would the real agents. `make test-e2e-office`
  # rebuilds it, so it has the fake and the scripts of the checkout.
  office-fake:
    description: A fake Claude Code and pi, for the office's end-to-end tests, with their scripts
    from: docker.io/library/ubuntu:26.04
    args:
      fake-source:
        description: the fake agent, built by `make build` (cargo build --release -p zapper-fake --target x86_64-unknown-linux-musl)
        default: ../target/x86_64-unknown-linux-musl/release/zapper-fake
      scripts:
        description: the scripts the fake plays, by name (a profile's ZAPPER_FAKE_SCRIPT, e.g. /fake/ceo.yaml)
        default: ../tests/fake
    run:
      - "apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git less procps iproute2 && rm -rf /var/lib/apt/lists/*"
    copy:
      - { from: fake-source, to: /usr/local/bin/claude }
      - { from: fake-source, to: /usr/local/bin/pi }
      - { from: scripts, to: /fake }
    after:
      - "claude --version && pi --version && ls /fake"

  # The zapperclaw office sandbox: zapperclaw (the host's build: make
  # build), and for the warden's end-to-end test a probe: curl to call the
  # warden's routes through its supervisor, socat to listen for the
  # forwards and agent streams.
  zapperclaw-office:
    description: The zapperclaw office sandbox (zapperclaw, and a probe with curl, socat and jq)
    from: docker.io/library/ubuntu:26.04
    args:
      zapperclaw:
        description: zapperclaw, built by `make build` (cargo build --release -p zapperclaw)
        default: ../target/release/zapperclaw
    run:
      - "apt-get update && apt-get install -y --no-install-recommends ca-certificates curl socat jq procps xxd && rm -rf /var/lib/apt/lists/*"
    copy:
      - { from: zapperclaw, to: /usr/local/bin/zapperclaw }
    after:
      - "curl --version && socat -V | head -1 && zapperclaw --help"

  # The cluster facility: k3s at a pinned release, with its air-gap images so
  # it starts without the internet, and the board's dashboard (Headlamp),
  # whose image goes into the air-gap directory so k3s imports it at start.
  # uidmap, slirp4netns and fuse-overlayfs are for k3s rootless: the sandbox's
  # kernel must allow user namespaces, and cgroup v2 with its controllers.
  k3s:
    description: A single-node k3s cluster (pinned), with its air-gap images and Headlamp
    from: docker.io/library/ubuntu:26.04
    run:
      - "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl iptables conntrack ipset zstd procps uidmap slirp4netns fuse-overlayfs && rm -rf /var/lib/apt/lists/*"
      - "curl -fsSL -o /usr/local/bin/k3s https://github.com/k3s-io/k3s/releases/download/v1.36.5%2Bk3s1/k3s && echo 'd73847bcd3c5fccef0115b372e2f9a91f3032dc84bbf71518a4617565294d313  /usr/local/bin/k3s' | sha256sum -c && chmod 755 /usr/local/bin/k3s && ln -sf k3s /usr/local/bin/kubectl"
      - "mkdir -p /var/lib/rancher/k3s/agent/images && curl -fsSL -o /var/lib/rancher/k3s/agent/images/k3s-airgap-images-amd64.tar.zst https://github.com/k3s-io/k3s/releases/download/v1.36.5%2Bk3s1/k3s-airgap-images-amd64.tar.zst && echo '7d939471907df2d4e537a9c308bf94173e453fff4a2e9e77e9ae92a64be3007f  /var/lib/rancher/k3s/agent/images/k3s-airgap-images-amd64.tar.zst' | sha256sum -c"
      - "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends skopeo && skopeo copy --override-os linux --override-arch amd64 docker://ghcr.io/headlamp-k8s/headlamp@sha256:8a0ef97527544baa2b35825940ddf4db6e2d09c30cd5aa31fd269ff604cc8b75 docker-archive:/var/lib/rancher/k3s/agent/images/headlamp.tar:ghcr.io/headlamp-k8s/headlamp:v0.46.0 && apt-get purge -y skopeo && apt-get autoremove -y && rm -rf /var/lib/apt/lists/*"
