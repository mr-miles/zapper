# The Office's own config: the firms zapper-office runs. Their profiles are
# config/zapper.yaml's, and the gateway is config/openshell.yaml's. The office
# validates each firm against the profiles when it starts, and
# `zapper-office config reload` re-reads this file and applies it atomically.
#
# See docs/office.md for the firm schema, and examples/*/office.yaml for
# complete firms (mini-firm, shopping-list, research-firm, github-firm).
firms: {}
