# zapperclaw's config (docs/zapperclaw.md): the roster, how many turns run
# at once and for how long. The warden copies this directory into the office
# sandbox at ~/.config/zapperclaw (office.config in config/warden.yaml), so a
# change reaches the office when its sandbox is made again.
#
# Each worker's profile is one the warden offers (profiles: in warden.yaml).
# The checkout's roster is the end-to-end test's (tests/e2e-zapperclaw.sh):
# one fake worker that answers the board's mail.
workers:
  echo:
    profile: zapperclaw-echo
    instructions: echo.md
    about: answers the board's mail
max_concurrent: 2
turn_timeout: 10m
# Where the post office keeps its state: database (office.db, the default),
# both (its events journaled too, so office.db can be made again from the
# journal), or journal (memory, from the journal at every start).
# store: database
