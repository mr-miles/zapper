[workspace]
resolver = "2"
members = ["crates/zapper-util", "crates/zapper-record", "crates/zapper-mint", "crates/zapper-client", "crates/zapper-proto", "crates/zapper-policy", "crates/zapper-api-types", "crates/zapper-driver", "crates/zapper-office", "crates/zapper-agent", "crates/zapper-fake", "crates/zapper-keeper", "crates/zapper-inspect", "crates/zapper-runs", "crates/zapper-github", "crates/zapper-git"]
# The workbench ran on the zapper daemon, which is gone; it waits to be
# ported onto OpenShell (with OpenShell's SSH in place of zapper-ssh).
exclude = ["crates/zapper-workbench", "crates/zapper-ssh"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
globset = "0.4"
thiserror = "2"

[profile.release]
# Thin LTO: most of fat LTO's benefit in a quarter of the build time.
lto = "thin"
# Keep symbols: a backtrace of a running daemon (gdb, perf) then names
# its functions. Debug info stays out; it would multiply the size.
strip = "none"
