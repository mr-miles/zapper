[workspace]
resolver = "2"
members = ["crates/zapper-proto", "crates/zapper-policy", "crates/zapper-core", "crates/zapper-api", "crates/zapper-office", "crates/zapper", "crates/zapper-agent", "crates/zapper-fake", "crates/zapper-keeper", "crates/zapper-inspect", "crates/zapper-runs", "crates/zapper-github", "crates/zapper-ssh", "crates/zapper-workbench"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
globset = "0.4"
thiserror = "2"

[profile.release]
# Thin LTO: most of fat LTO's benefit in a quarter of the build time.
lto = "thin"
# Keep symbols: a backtrace of a running daemon (gdb, perf) then names
# its functions. Debug info stays out; it would multiply the size.
strip = "none"
